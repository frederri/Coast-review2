<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coast v6</title>
<style>
  :root{
    --land:#c9be93;
    --water-hi:#235368;
    --water-lo:#0b2331;
    --water-shoal:#3c7482;
    --ink:#26231a;
    --parchment:#e4dcc0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--water-lo);}
  canvas{display:block;touch-action:none;}
  /* title and controls share a row while they fit; when they don't, the
     controls wrap under the title, then onto rows of their own */
  .top{position:fixed;top:16px;left:22px;right:22px;display:flex;flex-wrap:wrap;
       align-items:flex-start;gap:12px 24px;pointer-events:none;}
  .ui{margin-top:2px;color:var(--ink);user-select:none;}
  .ui h1{
    font-family:'Iowan Old Style',Georgia,'Times New Roman',serif;
    font-weight:600;font-size:15px;letter-spacing:.32em;text-transform:uppercase;
  }
  /* .9: at least 4.5:1 against the darkest shaded land it can sit on */
  .ui p{font-family:system-ui,sans-serif;font-size:12px;opacity:.9;margin-top:5px;letter-spacing:.02em;}
  .ctl{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;align-items:center;
       font-family:system-ui,sans-serif;font-size:13px;color:var(--ink);}
  .ctl > *{pointer-events:auto;}
  /* on a chip like the other controls: bare text vanished over dark sea */
  .ctl label{display:flex;gap:6px;align-items:center;letter-spacing:.02em;
             background:var(--parchment);border-radius:3px;padding-right:9px;}
  input[type=number]{
    font:inherit;color:var(--ink);background:var(--parchment);
    border:1.5px solid var(--ink);border-radius:3px;padding:6px 8px;
    width:76px;text-align:right;
  }
  input[type=number]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  button{
    font:inherit;letter-spacing:.03em;color:var(--ink);background:var(--parchment);
    border:1.5px solid var(--ink);border-radius:3px;padding:7px 14px;cursor:pointer;
  }
  button:hover{background:#efe8cf;}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .seg{display:flex;}
  .seg button{border-radius:0;border-left-width:0;}
  .seg button:first-child{border-radius:3px 0 0 3px;border-left-width:1.5px;}
  .seg button:last-child{border-radius:0 3px 3px 0;}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--parchment);}
  .busy, .busy *{cursor:wait !important;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<header class="top">
<div class="ui">
  <h1>Coast</h1>
  <p id="hint">Drag the handles up or down &nbsp;&middot;&nbsp; Space for a new coast</p>
</div>
<div class="ctl">
  <div class="seg" id="char" role="group" aria-label="Coast character">
    <button data-char="div" aria-pressed="true">Divergent</button>
    <button data-char="jag" aria-pressed="false">Jagged</button>
    <button data-char="grd" aria-pressed="false">Graded shoreline</button>
    <button data-char="mix" aria-pressed="false">Mixed</button>
  </div>
  <div class="seg" id="mode" role="group" aria-label="Feature">
    <button data-mode="plain" aria-pressed="true">Coast</button>
    <button data-mode="pen" aria-pressed="false">Peninsula</button>
    <button data-mode="sea" aria-pressed="false">Inland sea</button>
  </div>
  <div class="seg" id="ctrl" role="group" aria-label="Handles">
    <button data-ctrl="tilt" aria-pressed="true">Tilt</button>
    <button data-ctrl="points" aria-pressed="false">Points</button>
  </div>
  <label><input type="number" id="km" value="1000" min="200" max="20000" step="100" autocomplete="off"> km across</label>
  <button id="dots">Random handles</button>
  <button id="reroll">New coast</button>
</div>
</header>

<script id="coast-gen">
'use strict';
// Coast field generation.
// x in km across the box. u in km relative to the baseline, positive = seaward (down).
// Elevation phi = D(x,u) - u. Land where phi > 0. D positive pushes the coast seaward.

function hsh(ix, iy, s){
  let h = (Math.imul(ix, 0x27d4eb2d) ^ Math.imul(iy, 0x165667b1) ^ Math.imul(s, 0x9e3779b1)) | 0;
  h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function fade(t){ return t*t*t*(t*(t*6-15)+10); }
// Gradient noise: a hashed unit gradient at each lattice point, blended with
// the quintic fade. Value noise bunches its features into round lumps about
// the lattice points, and those lumps showed as rounded lobes all along the
// coast. The scale matches the value noise this replaced (same spread, same
// share of samples past each threshold used below), kept to ±1 as before.
const GRX = new Float64Array(16), GRY = new Float64Array(16);
for (let i = 0; i < 16; i++){ GRX[i] = Math.cos((i + 0.5)*Math.PI/8); GRY[i] = Math.sin((i + 0.5)*Math.PI/8); }
// hsh's mixing step, returning the top 4 bits: a gradient index
function hmix(h){
  h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 28;
}
function noise2(x, y, s){
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const u = fade(fx), v = fade(fy);
  // hsh for the four corners, sharing their row and column terms
  const hs = Math.imul(s, 0x9e3779b1);
  const x0 = Math.imul(ix, 0x27d4eb2d), x1 = Math.imul(ix + 1, 0x27d4eb2d);
  const y0 = Math.imul(iy, 0x165667b1) ^ hs, y1 = Math.imul(iy + 1, 0x165667b1) ^ hs;
  const ga = hmix(x0 ^ y0), gb = hmix(x1 ^ y0), gc = hmix(x0 ^ y1), gd = hmix(x1 ^ y1);
  const a = GRX[ga]*fx + GRY[ga]*fy,     b = GRX[gb]*(fx-1) + GRY[gb]*fy;
  const c = GRX[gc]*fx + GRY[gc]*(fy-1), d = GRX[gd]*(fx-1) + GRY[gd]*(fy-1);
  const n = ((a + (b-a)*u) * (1-v) + (c + (d-c)*u) * v) * 2.1;
  return n > 1 ? 1 : n < -1 ? -1 : n;
}
// noise2 is written out again inside the loop: this is the hot path, and
// noise2 is past what V8 will inline, which cost a call and a boxed
// number per octave
function fbm(x, y, s, oct, lam, gain){
  let f = 1/lam, amp = 1, sum = 0, norm = 0, xx = x, yy = y;
  for (let o = 0; o < oct; o++){
    const px = xx*f, py = yy*f;
    const ix = Math.floor(px), iy = Math.floor(py);
    const fx = px - ix, fy = py - iy;
    const hs = Math.imul(s + o*131, 0x9e3779b1);
    const x0 = Math.imul(ix, 0x27d4eb2d), x1 = Math.imul(ix + 1, 0x27d4eb2d);
    const y0 = Math.imul(iy, 0x165667b1) ^ hs, y1 = Math.imul(iy + 1, 0x165667b1) ^ hs;
    const ga = hmix(x0 ^ y0), gb = hmix(x1 ^ y0), gc = hmix(x0 ^ y1), gd = hmix(x1 ^ y1);
    const a = GRX[ga]*fx + GRY[ga]*fy,     b = GRX[gb]*(fx-1) + GRY[gb]*fy;
    const c = GRX[gc]*fx + GRY[gc]*(fy-1), d = GRX[gd]*(fx-1) + GRY[gd]*(fy-1);
    const u = fade(fx), v = fade(fy);
    let n = ((a + (b-a)*u) * (1-v) + (c + (d-c)*u) * v) * 2.1;
    n = n > 1 ? 1 : n < -1 ? -1 : n;
    sum += amp * n;
    norm += amp;
    amp *= gain; f *= 2.03;
    const nx = xx*0.766 - yy*0.643 + 137.1;
    yy = xx*0.643 + yy*0.766 - 61.7;
    xx = nx;
  }
  return sum/norm;
}
// along a single line the gradient noise spreads wider than across the
// plane; 0.764 brings it back to the spread the 1D users were tuned for
function fbm1(x, s, oct, lam, gain){
  let f = 1/lam, amp = 1, sum = 0, norm = 0;
  for (let o = 0; o < oct; o++){
    sum += amp * noise2(x*f, 0.37, s + o*131);
    norm += amp; amp *= gain; f *= 2.03; x += 91.7;
  }
  return 0.764*sum/norm;
}
// Math.hypot of two numbers, worked the way V8 works it (the larger of the
// two taken out, the sum of squares rooted and scaled back), so the result
// is the same to the last bit; the built-in gathers its arguments into an
// array first, and costs twice as long in the hot loops
function hyp(a, b){
  a = Math.abs(a); b = Math.abs(b);
  if (a === Infinity || b === Infinity) return Infinity;
  if (a !== a || b !== b) return NaN;
  const m = a > b ? a : b;
  if (m === 0) return 0;
  const p = a/m, q = b/m;
  return Math.sqrt(p*p + q*q)*m;
}
// (how a river's sand is laid along the five points of the line at its mouth)
const RIVER_SPREAD = [0.1, 0.2, 0.4, 0.2, 0.1];
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function sstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t*t*(3 - 2*t);
}

// Box blur along rows / down columns, radius k cells. Past the ends a line
// is continued by odd reflection, so its slope carries on: holding the end
// value instead put a kink in every pass where the window first reached
// past the edge, and the curvature read from the blur jumped there.
function lineAt(S, o, st, n, j){
  if (j < 0){ const m = -j < n ? -j : n - 1; return 2*S[o] - S[o + m*st]; }
  if (j >= n){ const m = 2*(n - 1) - j; return 2*S[o + (n - 1)*st] - S[o + (m < 0 ? 0 : m)*st]; }
  return S[o + j*st];
}
function blurLine(S, O, o, st, n, k){
  const w = 1/(2*k + 1);
  let acc = 0;
  for (let j = -k; j <= k; j++) acc += lineAt(S, o, st, n, j);
  for (let c = 0; c < n; c++){
    O[o + c*st] = acc*w;
    const a = c + k + 1, b = c - k;
    acc += (a < n ? S[o + a*st] : lineAt(S, o, st, n, a)) - (b >= 0 ? S[o + b*st] : lineAt(S, o, st, n, b));
  }
}
function blurRows(S, O, cols, rows, k){ for (let r = 0; r < rows; r++) blurLine(S, O, r*cols, 1, cols, k); }
function blurCols(S, O, cols, rows, k){ for (let c = 0; c < cols; c++) blurLine(S, O, c, cols, rows, k); }
// the same, holding the end values past the ends: for a land mask, where
// reflection would make up land or sea beyond the edge
function blurHold(S, O, o, st, n, k){
  const w = 1/(2*k + 1);
  let acc = 0;
  for (let j = -k; j <= k; j++) acc += S[o + (j < 0 ? 0 : j >= n ? n - 1 : j)*st];
  for (let c = 0; c < n; c++){
    O[o + c*st] = acc*w;
    const a = c + k + 1, b = c - k;
    acc += S[o + (a >= n ? n - 1 : a)*st] - S[o + (b < 0 ? 0 : b)*st];
  }
}
function blurHoldRows(S, O, cols, rows, k){ for (let r = 0; r < rows; r++) blurHold(S, O, r*cols, 1, cols, k); }
// (down the columns all at once, a row at a time, each column's running sum
// in its own slot: the same sums in the same order as blurHold down each
// column, but read and written along the rows, as the grid is laid out)
let HOLD_ACC = new Float64Array(0);
function blurHoldCols(S, O, cols, rows, k){
  if (HOLD_ACC.length < cols) HOLD_ACC = new Float64Array(cols);
  const acc = HOLD_ACC, w = 1/(2*k + 1);
  acc.fill(0, 0, cols);
  for (let j = -k; j <= k; j++){
    const o = (j < 0 ? 0 : j >= rows ? rows - 1 : j)*cols;
    for (let c = 0; c < cols; c++) acc[c] += S[o + c];
  }
  for (let r = 0; r < rows; r++){
    const a = r + k + 1, b = r - k, oa = (a >= rows ? rows - 1 : a)*cols, ob = (b < 0 ? 0 : b)*cols, oo = r*cols;
    for (let c = 0; c < cols; c++){
      O[oo + c] = acc[c]*w;
      acc[c] += S[oa + c] - S[ob + c];
    }
  }
}

// the inverse error function of 1 - y (Giles' single-precision
// approximation), taking y so that values near 1 keep their precision
function erfinv1m(y){
  let w = -Math.log(y*(2 - y)), p;
  if (w < 5){
    w -= 2.5;
    p = 2.81022636e-08; p = 3.43273939e-07 + p*w; p = -3.5233877e-06 + p*w;
    p = -4.39150654e-06 + p*w; p = 0.00021858087 + p*w; p = -0.00125372503 + p*w;
    p = -0.00417768164 + p*w; p = 0.246640727 + p*w; p = 1.50140941 + p*w;
  } else {
    w = Math.sqrt(w) - 3;
    p = -0.000200214257; p = 0.000100950558 + p*w; p = 0.00134934322 + p*w;
    p = -0.00367342844 + p*w; p = 0.00573950773 + p*w; p = -0.0076224613 + p*w;
    p = 0.00943887047 + p*w; p = 1.00167406 + p*w; p = 2.83297682 + p*w;
  }
  return p*(1 - y);
}

// How the coastlines of terrain T (land where T - u > 0) bend, as a
// roughness factor: above 1 where land bulges seaward, below 1 in bays.
// T is first smoothed over about sigma km (three box passes, close to a
// Gaussian), so this is the curvature of the coast at that scale, not of
// its detail; ell sets how strongly a bend of a given tightness counts.
function shapeRough(T, out, cols, rows, cell, sigma, ell, A, B){
  const k = Math.max(1, Math.round(sigma/cell));
  blurRows(T, A, cols, rows, k); blurRows(A, B, cols, rows, k); blurRows(B, A, cols, rows, k);
  blurCols(A, B, cols, rows, k); blurCols(B, A, cols, rows, k); blurCols(A, B, cols, rows, k);
  const h = 1/cell, h2 = h*h;
  out.fill(1);
  for (let r = 1; r < rows - 1; r++){
    for (let c = 1; c < cols - 1; c++){
      const i = r*cols + c;
      const px = (B[i+1] - B[i-1])*0.5*h, pu = (B[i+cols] - B[i-cols])*0.5*h - 1;
      const pxx = (B[i+1] - 2*B[i] + B[i-1])*h2, puu = (B[i+cols] - 2*B[i] + B[i-cols])*h2;
      const pxu = (B[i+cols+1] - B[i+cols-1] - B[i-cols+1] + B[i-cols-1])*0.25*h2;
      const g2 = px*px + pu*pu;
      // curvature of the level set through this cell: negative where the
      // land side is convex (a headland), positive in a bay
      const kap = (pxx*pu*pu - 2*pxu*px*pu + puu*px*px)/(g2*Math.sqrt(g2) + 1e-9);
      const m = Math.exp(-kap*ell);
      out[i] = m < 0.6 ? 0.6 : m > 2 ? 2 : m;
    }
  }
}

// Grain noise read along a direction th that varies over the map.
// Rotating the coordinates by a varying angle shears the noise more the
// further it is from the origin, which fanned the grain out like brush
// strokes; instead the noise is read at the two nearest of six fixed
// orientations and blended, which keeps it straight and aligned locally.
// Along the grain it is drawn out by stretch, less for each finer octave,
// so small features are not all slivers.
const GK = 6, GCT = new Float64Array(GK), GST = new Float64Array(GK);
for (let k = 0; k < GK; k++){ GCT[k] = Math.cos(k*Math.PI/GK); GST[k] = Math.sin(k*Math.PI/GK); }
function grainOne(x, u, k, s, oct, lam, gain, stretch){
  const xa = x*GCT[k] + u*GST[k], ua = u*GCT[k] - x*GST[k];
  let sum = 0, norm = 0, amp = 1, L = lam, S = stretch;
  for (let o = 0; o < oct; o++){
    sum += amp*fbm(xa/(S*L) + o*17.3, ua/L - o*11.9, s + k*977 + o*131, 1, 1, 1);
    norm += amp; amp *= gain; L /= 2.03; S = 1 + (S - 1)*0.8;
  }
  return sum/norm;
}
function grainAt(x, u, th, s, oct, lam, gain, stretch){
  let a = th/Math.PI*GK;
  a = ((a % GK) + GK) % GK;
  const k0 = Math.floor(a), f = a - k0, k1 = (k0 + 1) % GK;
  const n0 = grainOne(x, u, k0, s, oct, lam, gain, stretch);
  const n1 = grainOne(x, u, k1, s, oct, lam, gain, stretch);
  return ((1 - f)*n0 + f*n1)/Math.sqrt((1 - f)*(1 - f) + f*f);
}

// ---- the drowned landscape -------------------------------------------------
//
// The land is a landscape that rivers have worked on long enough to keep
// pace with the rock's uplift (the steady state of the stream power law):
// every cell drains to a lower neighbour all the way to the sea, and the
// slope a stream needs falls with the area it drains, so trunk valleys
// are gentle and the ground between them steep. The sea then stands at a
// level over it: valleys become bays and estuaries, spurs headlands,
// hilltops islands. On a Divergent coast sand and silt have since smoothed
// that outline; on a Jagged one ice has deepened the valleys into fjords.
//
// x in km across the view, u in km from the baseline (seaward positive).

const THETA = 0.45;            // slope falls with drained area as A^-THETA
const NBQ = 16384;             // buckets of the flood's priority queue
const DR8 = [-1, -1, -1, 0, 0, 1, 1, 1], DC8 = [-1, 0, 1, -1, 1, -1, 0, 1];

// Priority-Flood from the base level (kind 2) over the land (kind 1), in
// order of rising (filled) height: rcv[i] is the cell that reached i (its
// lowest neighbour, or the way out of a hollow), ord the cells in the order
// reached, so each comes after its receiver. A bucket queue keeps it
// linear; within a bucket, first in, first out. jit nudges each cell's
// place in the queue, so that where the ground falls evenly one way the
// streams wander instead of running straight down the grid.
function pflood(h, C, R, kind, rcv, ord, vis, head, tail, nxt, jit){
  const n = C*R;
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++){ if (kind[i]){ const v = h[i]; if (v < lo) lo = v; if (v > hi) hi = v; } }
  const sc = (NBQ - 1)/(hi - lo + 1e-9);
  head.fill(-1); tail.fill(-1); vis.fill(0);
  let cur = NBQ, no = 0;
  for (let i = 0; i < n; i++){
    if (kind[i] !== 2) continue;
    vis[i] = 1; rcv[i] = i;
    const b = ((h[i] - lo)*sc)|0;
    if (b < cur) cur = b;
    nxt[i] = -1; if (head[b] < 0) head[b] = i; else nxt[tail[b]] = i; tail[b] = i;
  }
  const hf = h;   // (filled heights are only needed for the queue order)
  for (;;){
    while (cur < NBQ && head[cur] < 0) cur++;
    if (cur >= NBQ) break;
    const i = head[cur]; head[cur] = nxt[i]; if (head[cur] < 0) tail[cur] = -1;
    ord[no++] = i;
    const r = (i/C)|0, c = i - r*C, pi = cur;
    for (let k = 0; k < 8; k++){
      const rr = r + DR8[k], cc = c + DC8[k];
      if (rr < 0 || rr >= R || cc < 0 || cc >= C) continue;
      const j = rr*C + cc;
      if (vis[j] || kind[j] !== 1) continue;
      vis[j] = 1; rcv[j] = i;
      let b = ((hf[j] + jit[j] - lo)*sc)|0;
      // (a hollow being filled is crossed in no particular order: taken in
      // turn, as they came, its cells would drain in straight lines)
      if (b < pi) b = pi + ((hsh(j, pi, 0x5bd1)*24)|0);
      if (b >= NBQ) b = NBQ - 1;
      nxt[j] = -1; if (head[b] < 0) head[b] = j; else nxt[tail[b]] = j; tail[b] = j;
    }
  }
  return no;
}

// Signed distance to the zero line of E (positive where E > 0), in cells:
// seeded where E changes sign between neighbours, at the crossing found by
// straight-line interpolation, then carried over the grid in two sweeps
// that pass on each cell's nearest crossing point (so it stays close to
// the true Euclidean distance).
// (the sweeps compare squared distances; roots are taken once, at the end.
// Each cell's best so far is held in locals through its neighbours and
// written once: out is a Float32Array, so the best is held rounded to
// float32 just as storing it rounds it, and every comparison sees the
// value it would have read back from the array)
function sdf(E, C, R, out, px, py){
  const n = C*R, BIG = 1e9, fr = Math.fround;
  px.fill(BIG, 0, n); py.fill(BIG, 0, n); out.fill(BIG, 0, n);
  for (let r = 0; r < R; r++){
    for (let c = 0; c < C; c++){
      const i = r*C + c, e = E[i], pos = e > 0;
      let best = BIG, bx = 0, by = 0;
      if (c > 0){ const f = E[i - 1]; if ((f > 0) !== pos){ const t = e/(e - f); if (t < best){ best = t; bx = c - t; by = r; } } }
      if (c < C - 1){ const f = E[i + 1]; if ((f > 0) !== pos){ const t = e/(e - f); if (t < best){ best = t; bx = c + t; by = r; } } }
      if (r > 0){ const f = E[i - C]; if ((f > 0) !== pos){ const t = e/(e - f); if (t < best){ best = t; bx = c; by = r - t; } } }
      if (r < R - 1){ const f = E[i + C]; if ((f > 0) !== pos){ const t = e/(e - f); if (t < best){ best = t; bx = c; by = r + t; } } }
      if (best < BIG){ out[i] = best*best; px[i] = bx; py[i] = by; }
    }
  }
  for (let r = 0; r < R; r++){
    const row = r*C;
    for (let c = 0; c < C; c++){
      const i = row + c;
      let o = out[i], bx = 0, by = 0, up = false, j, qx, qy, dx, dy, d;

  const PI = Math.PI;
  const sandM = U8(n), BAR = U8(n), LAG = U8(n), STR = F32(n).fill(-9);
  const work = { sand: sandM, bar: BAR, lag: LAG, str: STR, spits: 0, closedSpits: 0, tombolos: 0, salients: 0, cells: { cores: 0, nodes: 0, rounds: 0, calm: 0 }, phi: null };
  // bilinear read of a field at a point in km
  const at = (F, x, u) => {
    const gx = Math.max(0, Math.min(C - 1.001, (x - x0)/cell)), gy = Math.max(0, Math.min(R - 1.001, (u - u0)/cell));
    const c = gx|0, r = gy|0, fx = gx - c, fy = gy - r, i = r*C + c;
    return (F[i]*(1 - fx) + F[i + 1]*fx)*(1 - fy) + (F[i + C]*(1 - fx) + F[i + C + 1]*fx)*fy;
  };

  // -- the waves: this coast's climate --
  // A graded coast is drawn by the waves that reach it over millennia, not
  // by one swell. Most coasts lie open to an ocean swell: one main
  // direction, square to the coast or up to some 16 degrees off it (the
  // swash-aligned coasts, which have turned to face their swell as the
  // Danish west coast faces the North Sea's, and the drift-aligned ones,
  // along which it drives a steady drift), the waves spread 23 to 34
  // degrees about it. There the drift smooths the shore: hollows fill and
  // points wear back. The rest lie under a high-angle climate, in Ashton
  // and Murray's two numbers: U, the share of waves that
  // come in more than 45 degrees off the shore's normal, over a half, and
  // A, the share from one side, near a half. There the drift runs fastest
  // along a shore turned 45 degrees from the waves and a straight shore is
  // unstable: it breaks into cuspate capes, sharp seaward points between
  // concave arcs, which grow and merge, the larger shading the smaller (the
  // Carolina capes). With A far from a half the capes are drawn out into
  // flying spits; graded coasts do not keep those.
  const rw = rng(0x51ab0c);
  const hiA = rw() < 0.3;
  const side = wAng < 0 ? -1 : 1;
  const Uh = 0.53 + 0.06*rw(), Aw = 0.5 + 0.03*rw();
  const sw0 = side*(0.03 + 0.25*Math.pow(rw(), 2)), swS = 0.4 + 0.2*rw();
  // (and the sand budget: the sea takes more sand off a swell coast than
  // its rivers bring, and the shore goes back between its fixed points,
  // on some coasts faster than on others; a cuspate coast loses none)
  const loss = hiA ? 0 : 0.0006 + 0.0003*rw();
  const gauss = r => { let a = 0; for (let k = 0; k < 4; k++) a += r(); return (a - 2)*1.732; };

  // -- the ground: how it stands up to the waves --
  // The coast's fixed points: ribs of resistant ground (a moraine ridge, a
  // chalk or limestone core) running inland, roughly square to the coast's
  // broad line, at places along it some tens to a few hundred km apart,
  // thick along some stretches and far apart along others. However far the
  // shore goes back, where it crosses one it is held, and the shore either
  // side, worn back between them, hangs from them in arcs. RS is the rib's
  // hardness, 0 soft to 1 hard; RA its direction.
  const RS = F32(n), RA = F32(n), FD = F32(n);
  coarse(4*CS, 1, (x, u, v) => { v[0] = fbm(x, 0.3*u, sd ^ 0x6b06, 2, 0.4*W, 0.5); }, [FD]);
  // (the dot a Points coast is bent through: no point at it, or the coast
  // would come to a tip pointing at the dot)
  const xm = pins && pins.length > 2 ? pins[1] : null;
  // (a cuspate coast is all sand: its capes are its own work, not rock)
  if (!hiA){
    const rf = rng(0x6c01), xe = xOf(C - 1);
    for (let x = x0 + 0.1*L*rf(); x < xe; ){
      const c0 = Math.max(0, Math.min(C - 1, Math.round((x - x0)/cell))), ub = Bc[c0];
      const gap = (0.12 + 0.3*rf())*L*(1.3 - 0.6*sstep(-0.4, 0.3, at(FD, x, ub)));
      const hw = (0.003 + 0.003*rf())*L;
      const th = -TBA[c0] + (rf() - 0.5)*0.6, ax = Math.sin(th), au = Math.cos(th);
      // (none by the free dot, nor close by an end dot: a point there leaves
      // a notch or a corner just inside the map's edge)
      if ((xm === null || Math.abs(x - xm) > 0.06*W) && Math.min(Math.abs(x), Math.abs(x - W)) > 0.08*W){
        // (from the field's top to some way seaward of the line the coast is
        // drawn along; the land alone is rock, below)
        for (let r = 0; r < R; r++){
          const u = uOf(r);
          if (u > ub + 0.1*W) break;
          const xc = x + (u - ub)*ax/Math.max(0.3, au), ca = Math.max(0, Math.floor((xc - 3*hw - x0)/cell)), cb = Math.min(C - 1, Math.ceil((xc + 3*hw - x0)/cell));
          for (let c = ca; c <= cb; c++){
            const q = Math.abs((xOf(c) - xc)*au), v = sstep(2*hw, 0.6*hw, q), k = r*C + c;
            if (v > RS[k]){ RS[k] = v; RA[k] = th; }
          }
        }
        work.cells.cores++;
      }
      x += gap;
    }
  }

  // -- the land as a mask, kept as one piece --
  const M = U8(n), BF = U8(n), stk = I32(n), G = F32(n), T = F32(n), qx = F32(n), qy = F32(n), SD = F32(n);
  for (let i = 0; i < n; i++) M[i] = E[i] > 0 ? 1 : 0;
  // (the field's own edges: land along the top, sea along the bottom, and
  // the side columns, out of view, cut once at the baseline)
  for (const c of [0, C - 1]) for (let r = 0; r < R; r++) M[r*C + c] = uOf(r) < Bc[c] ? 1 : 0;
  // (a drowned valley running in further than a sixth of the map's width
  // behind the line the coast is drawn along is filled to that depth: its
  // mouth is sealed below in any case, and what lies behind is land)
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (uOf(r) < Bc[c] - 0.15*W) M[r*C + c] = 1;
  // (a few rows along the top kept land and along the bottom kept sea, so
  // that the line, traced on the mask eased by a cell or so, never runs off
  // the field; GR rows, the most the easing reaches)
  const GR = 4;
  const edges = () => { for (let k = 0; k < GR*C; k++){ M[k] = 1; M[n - 1 - k] = 0; } };
  const uLo = uOf(GR + 2), uHi = uOf(R - GR - 3);
  edges();
  // water the open sea does not reach is filled in (a lagoon behind its
  // barrier is land on this map), land not joined to the mainland is worn
  // away (islands do not survive on a graded coast); returns what changed
  const flood = (val, fromTop, mark) => {
    let sp = 0;
    const r0 = fromTop ? 0 : R - 1;
    for (let c = 0; c < C; c++){ const i = r0*C + c; if (M[i] === val){ M[i] = mark; stk[sp++] = i; } }
    while (sp){
      const i = stk[--sp], r = (i/C)|0, c = i - r*C;
      if (c > 0 && M[i - 1] === val){ M[i - 1] = mark; stk[sp++] = i - 1; }
      if (c < C - 1 && M[i + 1] === val){ M[i + 1] = mark; stk[sp++] = i + 1; }
      if (r > 0 && M[i - C] === val){ M[i - C] = mark; stk[sp++] = i - C; }
      if (r < R - 1 && M[i + C] === val){ M[i + C] = mark; stk[sp++] = i + C; }
    }
  };
  const clean = () => {
    let ch = 0;
    edges();
    flood(0, false, 2);
    for (let i = 0; i < n; i++){ if (M[i] === 0){ M[i] = 1; ch++; } else if (M[i] === 2) M[i] = 0; }
    flood(1, true, 3);
    for (let i = 0; i < n; i++){ if (M[i] === 1){ M[i] = 0; ch++; } else if (M[i] === 3) M[i] = 1; }
    return ch;
  };
  // the barriers: a bay whose mouth is narrower than 2 rb is closed off from
  // headland to headland (the land closed with a disc) and filled behind,
  // if it runs in on average at least 0.15 as far as its mouth is wide,
  // further than any graded arc (the deepest of which run in some 0.23 of
  // their width): an inlet, an estuary, or a deep bay, which the drift
  // closes with a spit and a barrier as it closed the Vistula and Curonian
  // lagoons and Lagoa dos Patos; a broad shallower bay is left open, to the
  // waves. Taken from the widest mouths to the narrowest, so that a bay is
  // judged whole
  const seal = (rb) => {
    const k = rb/cell, F = BF;   // 1: filled by the closing, 2: seen
    for (let i = 0; i < n; i++) G[i] = M[i] ? 1 : -1;
    sdf(G, C, R, SD, qx, qy);
    for (let i = 0; i < n; i++) G[i] = SD[i] + k;
    sdf(G, C, R, SD, qx, qy);
    for (let i = 0; i < n; i++) F[i] = !M[i] && SD[i] - k > 0 ? 1 : 0;
    // (each filled bay, and how far it runs in behind its barrier)
    for (let i0 = 0; i0 < n; i0++){
      if (F[i0] !== 1) continue;
      let sp = 0;
      stk[sp++] = i0; F[i0] = 2;
      const cells = [];
      while (sp){
        const i = stk[--sp], r = (i/C)|0, c = i - r*C;
        cells.push(i);
        if (c > 0 && F[i - 1] === 1){ F[i - 1] = 2; stk[sp++] = i - 1; }
        if (c < C - 1 && F[i + 1] === 1){ F[i + 1] = 2; stk[sp++] = i + 1; }
        if (r > 0 && F[i - C] === 1){ F[i - C] = 2; stk[sp++] = i - C; }
        if (r < R - 1 && F[i + C] === 1){ F[i + C] = 2; stk[sp++] = i + C; }
      }
      // (the barrier runs from headland to headland: the closing's disc left
      // its line as an arc bowed into the bay, so the bay is taken out to
      // the straight line across its mouth, the hull of what the disc cut off)
      const lo = new Int32Array(R).fill(C), hi = new Int32Array(R).fill(-1);
      let r0 = R, r1 = -1, ma = C, mb = -1, mc = R, md = -1;
      for (const i of cells){
        const r = (i/C)|0, c = i - r*C;
        if (c < lo[r]) lo[r] = c; if (c > hi[r]) hi[r] = c; if (r < r0) r0 = r; if (r > r1) r1 = r;
        // (its mouth: where it meets the open sea)
        if ((c > 0 && !F[i - 1] && !M[i - 1]) || (c < C - 1 && !F[i + 1] && !M[i + 1]) || (r > 0 && !F[i - C] && !M[i - C]) || (r < R - 1 && !F[i + C] && !M[i + C])){
          if (c < ma) ma = c; if (c > mb) mb = c; if (r < mc) mc = r; if (r > md) md = r;
        }
      }
      const hx = [], hy = [];
      for (let r = r0; r <= r1; r++) if (hi[r] >= 0){ hx.push(lo[r], hi[r]); hy.push(r, r); }
      const ord = hx.map((_, j) => j).sort((a, b) => hx[a] - hx[b] || hy[a] - hy[b]), H = [];
      const cr = (o, a, b) => (hx[a] - hx[o])*(hy[b] - hy[o]) - (hy[a] - hy[o])*(hx[b] - hx[o]);
      for (const j of ord){ while (H.length >= 2 && cr(H[H.length - 2], H[H.length - 1], j) <= 0) H.pop(); H.push(j); }
      const lower = H.length;
      for (let q = ord.length - 2; q >= 0; q--){ const j = ord[q]; while (H.length > lower && cr(H[H.length - 2], H[H.length - 1], j) <= 0) H.pop(); H.push(j); }
      H.pop();
      // (how far it runs in on average: its area over its mouth's width)
      let ah = 0;
      for (let e = 0; e < H.length; e++){ const a = H[e], b = H[(e + 1) % H.length]; ah += hx[a]*hy[b] - hx[b]*hy[a]; }
      const wm = mb < 0 ? 0 : hyp(mb - ma, md - mc) + 1;
      if (0.5*Math.abs(ah) < 0.15*wm*wm) continue;
      for (let r = r0; r <= r1; r++){
        let a = Infinity, b = -Infinity;
        for (let e = 0; e < H.length; e++){
          const p0 = H[e], p1 = H[(e + 1) % H.length], y0 = hy[p0], y1 = hy[p1];
          if ((y0 <= r && y1 >= r) || (y1 <= r && y0 >= r)){
            const x = y0 === y1 ? Math.min(hx[p0], hx[p1]) : hx[p0] + (r - y0)/(y1 - y0)*(hx[p1] - hx[p0]), x2 = y0 === y1 ? Math.max(hx[p0], hx[p1]) : x;
            if (x < a) a = x; if (x2 > b) b = x2;
          }
        }
        for (let c = Math.max(0, Math.ceil(a)); c <= Math.min(C - 1, Math.floor(b)); c++) M[r*C + c] = 1;
      }
    }
    clean();
  };

  // -- the shore as a line: traced along the mask's edge from the left side
  // of the field to the right, land on the left hand --
  const trace = () => traceShore(M, G, T, C, R, xOf, uOf);
  // the line laid out again at even steps along it
  const resample = (X, U, ds) => {
    const N = X.length, L = new Float64Array(N);
    for (let i = 1; i < N; i++) L[i] = L[i - 1] + hyp(X[i] - X[i - 1], U[i] - U[i - 1]);
    const M2 = Math.max(4, Math.round(L[N - 1]/ds) + 1), st = L[N - 1]/(M2 - 1), X2 = new Float64Array(M2), U2 = new Float64Array(M2);
    let k = 0;
    for (let m = 0; m < M2; m++){
      const s = m*st;
      while (k < N - 2 && L[k + 1] < s) k++;
      const t = Math.min(1, Math.max(0, (s - L[k])/Math.max(1e-9, L[k + 1] - L[k])));
      X2[m] = X[k] + (X[k + 1] - X[k])*t; U2[m] = U[k] + (U[k + 1] - U[k])*t;
    }
    X2[M2 - 1] = X[N - 1]; U2[M2 - 1] = U[N - 1];
    return { X: X2, U: U2 };
  };
  // the land behind the line, as a mask (the line closed along the top)
  const raster = (X, U) => rasterShore(M, X, U, C, R, x0, u0, cell, uOf);

  // -- the waves' work on the line: a one-line shoreline model --
  // Each step one wave event, its angle drawn from the climate. Along each
  // stretch of shore it reaches, the swell drives the drift
  //   Q = kq cos^(6/5)(phi) sin(phi)
  // (the CERC transport written for deep-water waves; phi the angle between
  // where the waves come from and the shore's normal), and the shore moves
  // out where the drift slows and back where it quickens, dn/dt = -dQ/ds.
  // A stretch behind a point that stands out across the waves' way, or
  // facing away from them, they reach only bent round the point (below). On
  // a swell coast the waves that reach a stretch also take sand offshore
  // (er), so the shore goes back. Where it crosses hard ground it is held:
  // the drift runs on past, but the shore there does not move. Below the
  // shoreface's own width (a few km) the one-line picture no longer holds
  // and the shore is held smooth (nu, a fourth-order damping, which leaves
  // every larger shape to the waves).
  const evolve = (X0, U0, steps, ds, kq, er, nu, salt, sq) => {
    let X = Float64Array.from(X0), U = Float64Array.from(U0), N = X.length;
    const MI = new Int32Array(RM.length);
    const N0 = N, rnd = rng(salt);
    let HN, TA, DP, Q, V, KP, LT, PW, HS, PB, QB, XL, UL;
    const grow = () => {
      const L2 = Math.ceil(1.5*N);
      XL = new Float64Array(L2); UL = new Float64Array(L2);
      HN = new Float64Array(L2); TA = new Float64Array(L2); DP = new Float64Array(L2); Q = new Float64Array(L2); V = new Float64Array(L2);
      KP = new Float64Array(L2); LT = new Uint8Array(L2); PW = new Float64Array(L2); HS = new Float64Array(L2); PB = new Float64Array(L2);
      QB = new Float64Array(2*L2 + 8);
    };
    grow();
    // (the waves are measured from the normal of the coast's own broad
    // course, which the user's dots bend: a frame laid along the baseline,
    // its distance along it and out from it, in which the waves reach and
    // shade the shore as they would a straight one)
    const SA = new Float64Array(C), CA = new Float64Array(C), SN = new Float64Array(C);
    for (let c = 0; c < C; c++){ CA[c] = Math.cos(TBA[c]); SN[c] = Math.sin(TBA[c]); SA[c] = c ? SA[c - 1] + cell/CA[c] : 0; }
    const local = () => {
      for (let i = 0; i < N; i++){
        const g = Math.max(0, Math.min(C - 1.001, (X[i] - x0)/cell)), c = g|0, f = g - c, d = U[i] - (Bc[c] + f*(Bc[c + 1] - Bc[c]));
        XL[i] = SA[c] + f*(SA[c + 1] - SA[c]) + d*(SN[c] + f*(SN[c + 1] - SN[c]));
        UL[i] = d*(CA[c] + f*(CA[c + 1] - CA[c]));
      }
    };
    const read = () => {
      if (HN.length < N) grow();
      for (let i = 0; i < N; i++){
        const x = X[i], u = U[i], a = Math.max(0, i - 1), b = Math.min(N - 1, i + 1);
        let tx = X[b] - X[a], tu = U[b] - U[a];
        const tl = hyp(tx, tu) || 1e-9; tx /= tl; tu /= tl;
        // (a rib holds the shore where it runs squarely across the rib: where
        // the shore runs along it or slants across it the waves work along
        // the rib's side, and it is worn back with the shore; its direction
        // is read from the strongest rib under the point)
        const gx = Math.max(0, Math.min(C - 1.001, (x - x0)/cell)), gy = Math.max(0, Math.min(R - 1.001, (u - u0)/cell));
        let k = (gy|0)*C + (gx|0);
        for (const j of [k + 1, k + C, k + C + 1]) if (RS[j] > RS[k]) k = j;
        const ca = -tu*Math.sin(RA[k]) + tx*Math.cos(RA[k]), rb = at(RS, x, u)*sstep(0.6, 0.9, Math.abs(ca));
        // (only the land as the work begins is rock: sand the drift has built
        // out over the sea floor in front of it is as loose as any other)
        HN[i] = rb*sstep(-1.5, 0.5, at(D0, x, u));
        TA[i] = -TBA[Math.max(0, Math.min(C - 1, Math.round((x - x0)/cell)))];
        // (and how deep the water is that the shore would build out into,
        // at the shoreface's foot some 3 km out: the sand has to fill it, so
        // a shore runs out over deep water the more slowly, capes, spits and
        // deltas with it)
        DP[i] = 1 + Math.max(0, -at(E, x - 3*tu, u + 3*tx))/20;
      }
      // (each river's mouth: the stretch of the line nearest where it came
      // out before, followed as the shore moves)
      for (let m = 0; m < RM.length; m++){
        let bi = 1, bd = Infinity;
        for (let i = 1; i < N - 1; i++){ const d = hyp(X[i] - RM[m].x, U[i] - RM[m].u); if (d < bd){ bd = d; bi = i; } }
        MI[m] = bi; RM[m].x = X[bi]; RM[m].u = U[bi];
      }
    };
    read();
    for (let s = 0; s < steps; s++){
      if (s % 16 === 0){
        let lo = 1e9, hi = 0;
        for (let i = 1; i < N; i++){ const h = hyp(X[i] - X[i - 1], U[i] - U[i - 1]); if (h < lo) lo = h; if (h > hi) hi = h; }
        if (lo < 0.5*ds || hi > 1.8*ds){ const q = resample(X, U, ds); X = q.X; U = q.U; N = X.length; }
        // (a line run wild, drawn out to many times its length or broken:
        // the round is given up)
        let fin = 0;
        for (let i = 0; i < N; i++) fin += X[i] + U[i];
        if (!(N < N0*3) || !isFinite(fin)) return null;
        read();
      }
      // this step's waves: from ar off the normal of the coast's broad
      // course, from the +x side when positive (under the high-angle climate
      // a share Uh of them more than 45 degrees off it, from either side;
      // else about the swell's own way)
      let ar;
      if (sq) ar = swS*gauss(rnd);
      else if (hiA){ const hi = rnd() < Uh, mag = (hi ? 1 + rnd() : rnd())*0.25*PI; ar = (rnd() < Aw ? side : -side)*mag; }
      else ar = Math.max(-1.5, Math.min(1.5, sw0 + swS*gauss(rnd)));
      // where the waves reach: a stretch is in the lee if the coast stands
      // out further along the way the waves come in, across their path
      // (the coast laid in bins across the waves' path, keeping in each the
      // furthest out along it)
      const sx = Math.sin(ar), su = Math.cos(ar);
      local();
      let pmin = 1e18, pmax = -1e18;
      for (let i = 0; i < N; i++){ const p = XL[i]*su - UL[i]*sx; PB[i] = p; if (p < pmin) pmin = p; if (p > pmax) pmax = p; }
      const nb = Math.min(QB.length, 2*N + 8), bw = Math.max(0.5*ds, (pmax - pmin)/(nb - 1));
      for (let b = 0; b < nb; b++) QB[b] = -1e18;
      for (let i = 0; i < N - 1; i++){
        const q = Math.max(XL[i]*sx + UL[i]*su, XL[i + 1]*sx + UL[i + 1]*su);
        const b0 = Math.floor((Math.min(PB[i], PB[i + 1]) - pmin)/bw), b1 = Math.floor((Math.max(PB[i], PB[i + 1]) - pmin)/bw);
        for (let b = b0; b <= b1; b++) if (q > QB[b]) QB[b] = q;
      }
      for (let i = 0; i < N - 1; i++){
        const xm2 = 0.5*(XL[i] + XL[i + 1]), um = 0.5*(UL[i] + UL[i + 1]);
        const b = Math.floor((0.5*(PB[i] + PB[i + 1]) - pmin)/bw);
        LT[i] = QB[b] > xm2*sx + um*su + 3*ds ? 0 : 1;
      }
      // the drift along each stretch, and the waves' power on it
      for (let i = 0; i < N - 1; i++){
        const dx = X[i + 1] - X[i], du = U[i + 1] - U[i];
        HS[i] = hyp(dx, du) || 1e-9;
        // (a stretch in the lee has no direct waves, whatever its angle)
        if (!LT[i]){ Q[i] = 0; PW[i] = 0; continue; }
        let ph = ar + 0.5*(TA[i] + TA[i + 1]) - Math.atan2(-du, dx);
        ph -= 2*PI*Math.round(ph/(2*PI));
        const c = Math.cos(ph);
        if (c <= 0){ Q[i] = 0; PW[i] = 0; LT[i] = 0; continue; }
        Q[i] = -kq*Math.pow(c, 1.2)*Math.sin(ph);
        PW[i] = c;
      }
      // (in the lee of a point the waves are not gone: they bend round it,
      // spreading from its tip, the lower the further they turn. What
      // reaches a stretch there comes from the point it lies behind, so the
      // shore in the lee curls round the point, as a headland bay's does)
      const dn = sx > 0 ? -1 : 1;
      for (let k = 0, j = -1; k < N - 1; k++){
        const i = dn > 0 ? k : N - 2 - k;
        if (LT[i]){ j = dn > 0 ? i + 1 : i; continue; }
        if (j < 0) continue;
        const fx = XL[j] - 0.5*(XL[i] + XL[i + 1]), fu = UL[j] - 0.5*(UL[i] + UL[i + 1]), cd = (fx*sx + fu*su)/(hyp(fx, fu) || 1e-9);
        if (cd <= 0) continue;
        let ph = Math.atan2(fx, fu) + 0.5*(TA[i] + TA[i + 1]) - Math.atan2(-(U[i + 1] - U[i]), X[i + 1] - X[i]);
        ph -= 2*PI*Math.round(ph/(2*PI));
        const c = Math.cos(ph), kd = 0.2*cd*cd*cd;
        if (c <= 0) continue;
        Q[i] = -kq*kd*Math.pow(c, 1.2)*Math.sin(ph);
        PW[i] = kd*c;
      }
      for (let i = 1; i < N - 1; i++){
        const h0 = HS[i - 1], h1 = HS[i];
        const ax = (X[i + 1] - X[i])/h1 - (X[i] - X[i - 1])/h0, au = (U[i + 1] - U[i])/h1 - (U[i] - U[i - 1])/h0;
        let tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9; tx /= tl; tu /= tl;
        KP[i] = 2*(ax*(-tu) + au*tx)/(h0 + h1);
        V[i] = -2*(Q[i] - Q[i - 1])/(h0 + h1) - er*0.5*(PW[i - 1] + PW[i]);
      }
      // (the rivers' sand, laid down at their mouths, km2 a step)
      for (let m = 0; m < RM.length; m++){
        const i0 = MI[m], q = RM[m].q;
        for (let j = -2; j <= 2; j++){ const i = i0 + j; if (i > 0 && i < N - 1) V[i] += q*RIVER_SPREAD[j + 2]/HS[i]; }
      }
      KP[0] = KP[1]; KP[N - 1] = KP[N - 2];
      for (let i = 1; i < N - 1; i++){
        const a = Math.max(0, i - 1), b = Math.min(N - 1, i + 1);
        // (the shoreface's damping; and the hard ground holds the shore:
        // there it goes back only as fast as the rock is worn)
        let v = (V[i] - nu*(KP[b] - 2*KP[i] + KP[a]))*(1 - HN[i]);
        if (v > 0) v /= DP[i];
        V[i] = Math.max(-0.25*ds, Math.min(0.25*ds, v));
      }
      for (let i = 1; i < N - 1; i++){
        let tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9;
        X[i] += V[i]*(-tu/tl); U[i] += V[i]*(tx/tl);
      }
      // (the ends, out of view, run on level with their neighbours)
      U[0] = U[1]; U[N - 1] = U[N - 2];
      // (and the line stays clear of the guard rows)
      for (let i = 0; i < N; i++){ if (U[i] < uLo) U[i] = uLo; else if (U[i] > uHi) U[i] = uHi; }
    }
    return resample(X, U, ds);
  };
  // (a short smoothing: no waves, the line eased by its curvature, to take
  // the grid's steps out of a line traced off the mask)
  const ease = (X0, U0, steps, ds) => {
    let X = Float64Array.from(X0), U = Float64Array.from(U0);
    const N = X.length, V = new Float64Array(N);
    for (let s = 0; s < steps; s++){
      for (let i = 1; i < N - 1; i++){
        const h0 = hyp(X[i] - X[i - 1], U[i] - U[i - 1]) || 1e-9, h1 = hyp(X[i + 1] - X[i], U[i + 1] - U[i]) || 1e-9;
        const ax = (X[i + 1] - X[i])/h1 - (X[i] - X[i - 1])/h0, au = (U[i + 1] - U[i])/h1 - (U[i] - U[i - 1])/h0;
        let tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9; tx /= tl; tu /= tl;
        V[i] = 0.2*ds*ds*2*(ax*(-tu) + au*tx)/(h0 + h1);
      }
      for (let i = 1; i < N - 1; i++){
        let tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9;
        X[i] += V[i]*(-tu/tl); U[i] += V[i]*(tx/tl);
      }
      U[0] = U[1]; U[N - 1] = U[N - 2];
    }
    return { X, U };
  };

  // -- the work, round by round: between rounds the line is laid on the
  // grid again, any loop it has drawn across itself taken out, and a bay
  // the drift has all but closed sealed by its barrier --
  clean();
  const ds = L/360;
  for (const rb of [0.2, 0.12, 0.06, 0.03, 0.015]) seal(rb*L);
  // (how far each point lies inside the land as the work begins, cells)
  const D0 = F32(n);
  for (let i = 0; i < n; i++) G[i] = M[i] ? 1 : -1;
  sdf(G, C, R, D0, qx, qy);
  // (should the line be lost, the coast is left as it stood, and the
  // console says so: it is a fault, never a look)
  const lost = what => console.warn('Graded shoreline: ' + what + ', the coast is left as it stood (seed ' + seed + ')');
  let line = trace();
  if (!line) lost('no shore to trace');
  // the rivers: where the greatest of them reach the shore, the sand they
  // bring builds out a delta, which the waves spread along the coast; a
  // point source of sand on a wave-graded coast is pinned in the drift as a
  // cusp, and a big river's builds into a broad bulge (the Nile's, the
  // Volta's). Some coasts' rivers bring little and build none
  const RM = [];
  if (line && !hiA && A){
    const rr = rng(0x0de17a), q0 = rr() < 0.7 ? (0.02 + 0.065*rr())*ds*ds : 0;
    const X = line.X, U = line.U, N = X.length, AM = new Float64Array(N);
    for (let i = 1; i < N - 1; i++){
      let tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
      const tl = hyp(tx, tu) || 1e-9; tx /= tl; tu /= tl;
      for (let k = 1; k <= 8; k++){
        const d = k*0.004*L, x = X[i] + tu*d, u = U[i] - tx*d;
        const c = Math.round((x - x0)/cell), r = Math.round((u - u0)/cell);
        if (c >= 0 && c < C && r >= 0 && r < R && A[r*C + c] > AM[i]) AM[i] = A[r*C + c];
      }
    }
    // (a mouth: the line's crossing of a channel draining more than the
    // rest within some tens of km either side, in view or near it)
    const cand = [], wn = Math.max(2, Math.round(0.04*L/ds));
    for (let i = wn; i < N - wn; i++){
      if (X[i] < -0.05*W || X[i] > 1.05*W) continue;
      let top = true;
      for (let j = i - wn; j <= i + wn && top; j++) if (AM[j] > AM[i]) top = false;
      if (top && AM[i] > 0) cand.push(i);
    }
    cand.sort((a, b) => AM[b] - AM[a]);
    const amax = cand.length ? AM[cand[0]] : 0;
    for (const i of cand){
      if (RM.length >= 3 || AM[i] < 0.25*amax || q0 <= 0) break;
      // (one mouth to a river, and not at a dot: a delta there would be
      // drawn to a point at it)
      if (RM.some(m => Math.abs(m.x - X[i]) < 0.08*L) || (pins && pins.some(p => Math.abs(X[i] - p) < 0.06*W))) continue;
      RM.push({ x: X[i], u: U[i], q: q0*Math.pow(AM[i]/amax, 0.7) });
    }
  }
  if (line){
    line = resample(line.X, line.U, ds);
    // (the drift's strength, km2 a step at the most; the sand lost offshore,
    // km a step at full exposure; the shoreface damping; and the number of
    // steps: on a swell coast enough for the drift to reach across the
    // widest gaps between fixed points, so that each arc between them has
    // settled as deep as the loss and the drift make it; on a cuspate coast
    // half as many, for its capes to merge to some quarter of the length
    // scale apart, as the Carolina capes stand)
    const kq = 0.3*ds*ds, er = loss*ds, nu = 0.06*ds*ds, NS = Math.round(Math.pow(0.15*L, 2)/((hiA ? 0.24 : 0.12)*ds*ds)), NR = 4;
    for (let k = 0; k <= NR; k++){
      // (the last, short round only lets the waves round off the barriers
      // the round before it closed into the shore: on a swell coast with the
      // swell square on, so that it starts no new spit; nothing is sealed
      // after it)
      const st = k < NR ? Math.round(NS/NR) : Math.round(NS/(3*NR)), sq = k === NR && !hiA;
      let next = evolve(line.X, line.U, st, ds, kq, er, nu, 0x3a11 + k, sq);
      if (!next){ work.cells.calm++; next = evolve(line.X, line.U, st, ds, 0, er, nu, 0x3a11 + k, sq); }
      if (!next){ lost('the shore ran wild'); break; }
      line = next;
      work.cells.rounds++;
      // (a spit the drift has run out across a bay closes it, and what lies
      // behind is land on this map: the barrier's seaward face is the coast)
      if (k === NR) break;
      raster(line.X, line.U);
      clean();
      for (const rb of [0.06, 0.03, 0.015]) seal(rb*L);
      const t = trace();
      if (!t){ lost('the shore was lost between rounds'); break; }
      line = resample(t.X, t.U, ds);
      line = ease(line.X, line.U, 12, ds);
    }
    raster(line.X, line.U);
    clean();
    work.cells.nodes = line.X.length;
  }

  // -- the line as a signed distance, km: exact within a few cells of it --
  const P = F32(n);
  for (let i = 0; i < n; i++) G[i] = M[i] ? 1 : -1;
  sdf(G, C, R, P, qx, qy);
  if (line){
    const B = 4, DB = SD.fill(1e9), X = line.X, U = line.U;
    for (let k = 0; k + 1 < X.length; k++){
      const ax = X[k], au = U[k], dx = X[k + 1] - ax, du = U[k + 1] - au, L2 = dx*dx + du*du || 1e-12;
      const ca = Math.max(0, Math.floor((Math.min(ax, ax + dx) - x0)/cell) - B), cb = Math.min(C - 1, Math.ceil((Math.max(ax, ax + dx) - x0)/cell) + B);
      const ra = Math.max(0, Math.floor((Math.min(au, au + du) - u0)/cell) - B), rb = Math.min(R - 1, Math.ceil((Math.max(au, au + du) - u0)/cell) + B);
      for (let r = ra; r <= rb; r++){
        const u = uOf(r);
        for (let c = ca; c <= cb; c++){
          const x = xOf(c), t = Math.max(0, Math.min(1, ((x - ax)*dx + (u - au)*du)/L2));
          const d = hyp(x - ax - t*dx, u - au - t*du)/cell, i = r*C + c;
          if (d < DB[i]) DB[i] = d;
        }
      }
    }
    for (let i = 0; i < n; i++) if (DB[i] < B) P[i] = M[i] ? Math.max(1e-3, DB[i]) : -Math.max(1e-3, DB[i]);
  }
  for (let i = 0; i < n; i++) P[i] *= cell;
  // the land as it is left: sand laid down where there was water (a plain a
  // few metres up), the sea floor off the shore a smooth slope a few metres
  // down and deepening seaward, as the waves leave it: the drowned land's
  // hollows close in under a graded shore are filled, further out they stay
  for (let i = 0; i < n; i++){
    if (M[i]){ if (E[i] <= 0){ E[i] = 2 + Math.min(4, 0.4*P[i]); sandM[i] = 1; } continue; }
    const z = -Math.min(0.8*zs, 2 + 0.6*(-P[i])), w = E[i] > 0 ? 1 : 1 - sstep(0.04*W, 0.1*W, -P[i]);
    E[i] += w*(z - E[i]);
  }
  work.phi = P;
  return work;
}

// ---- 3 (mixed). the graded shoreline's work, as far as rock and sand allow --
//
// A real coast is rarely all one kind. Along it the rock and the sand change,
// and the same waves that grade one stretch into long arcs leave the next as
// rugged as it drowned (Johnson's youth and maturity side by side). So this
// is the Divergent coast, as drawn above, worked on by the waves of a graded
// one (gradeShore's one-line model: its drift, its lee, its barriers and the
// sand it loses offshore), with what a graded coast takes for granted left
// to the ground:
//  - sand. The drift only moves sand that is there: each point of the shore
//    carries a beach of its own width b (km, from the rock out to the line);
//    off bare rock the drift has nothing to carry and the shoreface nothing
//    to smooth. Sand comes from the shelf (a supply that differs from one
//    stretch to the next, as littoral cells are fed or starved), from the
//    rivers' mouths, and from the rock the waves wear back, as much of it as
//    was sand; it goes offshore, along the shore, and into the barriers
//    across the bays it closes. Nothing makes or loses sand but these: over
//    deep water the shore moves the more slowly either way;
//  - the barriers. A bay is closed only if the sand along the open coast
//    either side of its mouth, or what the drift has carried into it, will
//    build a barrier across it, the more the wider and deeper the mouth;
//    and the barrier is laid in the shape the waves hold a bay's beach to,
//    a spiral curl in the lee of the updrift headland and a straight beach
//    along the crests (Yasso; Hsu and Evans), not a ruler's line;
//  - the rock. Bare rock goes back only as fast as it wears, by the law the
//    sea's front cut it with, slower through a dike's or a rib's hard core;
//    a beach changes that rate (Limber and Murray, 2011): a thin one is the
//    waves' tools and wears it faster, a broad one keeps the waves off it.
// The waves are this coast's own swell, the one its Divergent bays were hung
// for. Where there is sand, or the ground is loose enough to give it, the
// coast grades; where the rock is hard and the shelf bare, it stays as it
// drowned; in between bays fill part way, spits reach part way across their
// mouths and soft points are cut back part way. Nothing is blended: the
// stretches differ because the ground and the sand along them do.
// The line follows the coast at its own resolution; what is finer than that
// (the rock's small capes and coves) rides on it as it lay, unless sand has
// buried it or the ground was loose and went back as a smooth cliff. The
// islands are worn by the same law as the mainland's rock, and buried or
// tied to the land off a reworked shore. Returns the coast as a signed
// distance in km, and how much of each place the waves have left as it was
// (1) or reworked (0).
function gradeMix(K){
  const { phi: PD0, E, H, HD, CM, RG, A, EXPO, sandIn, C, R, n, cell, xOf, uOf, Wkm, seed, wAng, TBA, Bc, pins, zs, coarse, CS } = K;
  const W = Wkm, x0 = xOf(0), u0 = uOf(0), PI = Math.PI;
  // (the sizes the waves work at, and their seeds, as on a graded coast)
  const L = W*Math.pow(1000/W, 0.35);
  const sd = seed ^ Math.imul(Math.round(W), 0x2c1b3c6d);
  const rng = salt => { const r = mulberry32(Math.imul(sd ^ salt, 0x9e3779b1) ^ Math.imul(salt, 0x85ebca6b)); r(); r(); return r; };
  const at = (F, x, u) => {
    const gx = Math.max(0, Math.min(C - 1.001, (x - x0)/cell)), gy = Math.max(0, Math.min(R - 1.001, (u - u0)/cell));
    const c = gx|0, r = gy|0, fx = gx - c, fy = gy - r, i = r*C + c;
    return (F[i]*(1 - fx) + F[i + 1]*fx)*(1 - fy) + (F[i + C]*(1 - fx) + F[i + C + 1]*fx)*fy;
  };
  const info = { rounds: 0, sealed: 0, spits: 0, bayheads: 0, refused: 0, rivers: 0, ribs: 0, nodes: 0, graded: 0, islandsWorn: 0, calm: 0 };
  const gauss = r => { let a = 0; for (let k = 0; k < 4; k++) a += r(); return (a - 2)*1.732; };

  // -- the rock's own coast: the sea cut into the rock as far as each part
  // of it gives way --
  // A rock coast is rugged because its rock is not one rock: the sea works
  // along the beds, joints and faults it finds weak and leaves what is sound
  // standing, so a bay is cut wherever a band or a fracture zone is soft and
  // a point stands wherever it is hard (differential erosion; Sunamura 2015).
  // How fast the cliff goes back runs over orders of magnitude with the
  // rock's strength (Prémaillon et al., 2018: some 3 cm a year for hard rock,
  // tens of cm for weak, metres for till), so the rate here falls
  // exponentially with the rock's resistance, a little faster where the
  // waves come in unbroken. The resistance is the ground's hardness with the
  // structure's variations on it, banded and jointed across the coast (as a
  // discordant coast is cut into coves along its soft bands); where the
  // structure is broken up the variations are the greater, and so the shore.
  // The sea cuts its way in from the open water as a front, each place
  // reached only once the rock before it has gone, at the rate of the rock it
  // is in: so a soft band behind a sound one is safe until the sea breaks
  // through, and then is scooped out behind a narrow mouth (Lulworth Cove,
  // Stair Hole), and the sea's way in along a soft band or a joint wears on
  // only as far as its time allows. (Each place cut back by its own rate
  // alone, the soft bands across a narrow island were cut through all at
  // once and left it a comb of slivers.) What is left standing off the new
  // shore, a hard knob the sea has gone round, is a stack or a skerry (as
  // the damped erosion of a heterogeneous coast leaves; Sapoval et al.,
  // 2004). On sand nothing here matters: the beaches below bury it.
  const PD = F32(n);
  {
    const lam = 0.03*L, d50 = 0.008*L, vmax = 3, band = vmax*d50 + 2*cell;
    const sb = sd ^ 0x7c3e1, sj = sd ^ 0x7c3e2, jt = (rng(0x7c3e3)() - 0.5)*0.9;
    // (V: how fast the sea cuts into each place against the middling rock)
    const V = F32(n);
    for (let r = 0; r < R; r++){
      const u = uOf(r);
      for (let c = 0; c < C; c++){
        const i = r*C + c, p = PD0[i];
        if (p <= 0 || p > band) continue;
        const x = xOf(c), th = TBA[c] + 0.5*PI + jt;
        // (the beds: broad bands across the coast, finer variations within)
        const nb = grainAt(x, u, th, sb, 4, lam, 0.6, 2.2);
        // (the joints and faults: narrow zones of shattered rock, the lines
        // where a drawn-out noise crosses nought)
        const nj = grainAt(x, u, th + 0.3*Math.sin(x/lam), sj, 3, 0.7*lam, 0.5, 3.5);
        const joint = 1 - sstep(0.015, 0.06, Math.abs(nj));
        const res = Math.min(1, Math.max(0, 0.12 + 0.8*Math.max(H[i], HD[i]) + (0.35 + 0.45*RG[i])*nb - 0.3*joint));
        const ex = 0.6 + 0.8*sstep(0.25, 0.65, EXPO[i]);
        V[i] = Math.min(vmax, ex*Math.exp(-6*(res - 0.5)));
      }
    }
    // (the open sea: the water joined to the field's bottom row)
    const SEA = U8(n), stk2 = new Int32Array(n);
    let sp = 0;
    for (let c = 0; c < C; c++){ const i = (R - 1)*C + c; if (PD0[i] <= 0){ SEA[i] = 1; stk2[sp++] = i; } }
    while (sp){
      const i = stk2[--sp], r = (i/C)|0, c = i - r*C;
      if (c > 0 && !SEA[i - 1] && PD0[i - 1] <= 0){ SEA[i - 1] = 1; stk2[sp++] = i - 1; }
      if (c < C - 1 && !SEA[i + 1] && PD0[i + 1] <= 0){ SEA[i + 1] = 1; stk2[sp++] = i + 1; }
      if (r > 0 && !SEA[i - C] && PD0[i - C] <= 0){ SEA[i - C] = 1; stk2[sp++] = i - C; }
      if (r < R - 1 && !SEA[i + C] && PD0[i + C] <= 0){ SEA[i + C] = 1; stk2[sp++] = i + C; }
    }
    // (TA: when the front reaches each place, as the km it would have cut
    // through the middling rock by then; started on the shore at the rock's
    // own distance from it, so the front starts where the coast lies, not on
    // the cells' steps)
    const TA = F32(n).fill(1e9), hk = [], hv = [];
    const push = (i, t) => {
      let k = hk.length; hk.push(i); hv.push(t);
      while (k){ const q = (k - 1) >> 1; if (hv[q] <= t) break; hk[k] = hk[q]; hv[k] = hv[q]; k = q; }
      hk[k] = i; hv[k] = t;
    };
    const pop = () => {
      const i = hk[0], last = hk.pop(), lt = hv.pop(), m = hk.length;
      if (m){
        let k = 0;
        for (;;){
          let j = 2*k + 1;
          if (j >= m) break;
          if (j + 1 < m && hv[j + 1] < hv[j]) j++;
          if (hv[j] >= lt) break;
          hk[k] = hk[j]; hv[k] = hv[j]; k = j;
        }
        hk[k] = last; hv[k] = lt;
      }
      return i;
    };
    for (let r = 1; r < R - 1; r++) for (let c = 1; c < C - 1; c++){
      const i = r*C + c;
      if (!V[i] || !(SEA[i - 1] || SEA[i + 1] || SEA[i - C] || SEA[i + C])) continue;
      const t = PD0[i]/V[i];
      if (t < TA[i]){ TA[i] = t; push(i, t); }
    }
    const D8 = [-C - 1, -C, -C + 1, -1, 1, C - 1, C, C + 1], L8 = [Math.SQRT2, 1, Math.SQRT2, 1, 1, Math.SQRT2, 1, Math.SQRT2];
    while (hk.length){
      const t0 = hv[0], i = pop();
      if (t0 > TA[i] || t0 > d50) continue;
      const r = (i/C)|0, c = i - r*C;
      if (r < 1 || r > R - 2 || c < 1 || c > C - 2) continue;
      for (let k = 0; k < 8; k++){
        const j = i + D8[k];
        if (!V[j]) continue;
        const t = t0 + L8[k]*cell*2/(V[i] + V[j]);
        if (t < TA[j]){ TA[j] = t; push(j, t); }
      }
    }
    // (the rock as it is left: cut where the front came in time, as far
    // behind the front as it would have gone on through that rock)
    const Q = F32(n);
    for (let i = 0; i < n; i++){ const p = PD0[i]; Q[i] = p > 0 && V[i] ? Math.min(p, (TA[i] - d50)*V[i]) : p; }
    // (and laid back as a true distance, km)
    const qx0 = F32(n), qy0 = F32(n);
    sdf(Q, C, R, PD, qx0, qy0);
    for (let i = 0; i < n; i++) PD[i] *= cell;
  }

  // -- the waves: this coast's climate, drawn as a graded coast's is, but
  // about the swell the Divergent coast's own bays were drawn by (wAng, off
  // the coast's normal): its headland bays are hung for it, so the work
  // carries on from them, and the bays it makes are the same zeta bays, a
  // curl in the lee of the point the swell comes past and a straight beach
  // lying along its crests, slanting across the coast's broad line. (About
  // a graded coast's near square-on swell, every beach turned to face the
  // map's own line: flat runs stepped at the points.) No more than some 25
  // degrees off: past 45 the drift makes a straight shore unstable, and with
  // the swell's spread about it a third of the waves came in past 45, which
  // rolled the spits over into curls --
  const rw = rng(0x51ab0c);
  const hiA = rw() < 0.3;
  const side = wAng < 0 ? -1 : 1;
  const Uh = 0.53 + 0.06*rw(), Aw = 0.5 + 0.03*rw();
  rw();   // (a graded coast's own swell angle: drawn and left, so the draws after it match)
  const sw0 = Math.max(-0.45, Math.min(0.45, wAng)), swS = 0.4 + 0.2*rw();
  const loss = 0.0006 + 0.0003*rw();

  // -- the ground --
  // KE: how fast bare rock wears, against the softest. Cliff retreat spans
  // three orders of magnitude and more: glacial till and soft clay go back
  // metres a year, chalk and weak sandstone some tenths of a metre, hard
  // limestone centimetres, granite and gneiss millimetres (Sunamura 1992;
  // Prémaillon et al. 2018). So the rate falls by a factor of ten for each
  // third of the way from the softest ground to the hardest rock, and
  // slower again through a dike's hard core. (The front that cut the coast
  // above runs on a gentler law, exp(-3.2 H), a mere 25 times from end to
  // end: worn by that, ordinary rock went back kilometres in the work and
  // fed the drift sand enough to fill every inlet of a starved coast.) FS:
  // the share of what is worn that is sand and stays on the shore as beach
  // (most of a soft cliff of sand and till, little of hard rock, which
  // goes as fines).
  const KE = F32(n), FS = F32(n), SG = F32(n);
  for (let i = 0; i < n; i++){
    const h = Math.max(H[i], HD[i]);
    KE[i] = Math.pow(10, -3*h)/CM[i];
    FS[i] = 0.1 + 0.6*(1 - h);
  }
  // (and the soft ground's own fixed points, as on a graded coast: ribs of
  // resistant ground, a moraine ridge or a chalk core, running inland
  // roughly square to the coast at places some tens to hundreds of km
  // apart. They count only where the ground about them is soft: there the
  // shore either side goes back and hangs from them in arcs, and they stand
  // as the cusps between)
  if (!hiA){
    const FD = F32(n), RS = F32(n);
    coarse(4*CS, 1, (x, u, v) => { v[0] = fbm(x, 0.3*u, sd ^ 0x6b06, 2, 0.4*W, 0.5); }, [FD]);
    const xm = pins && pins.length > 2 ? pins[1] : null;
    const rf = rng(0x6c01), xe = xOf(C - 1);
    for (let x = x0 + 0.1*L*rf(); x < xe; ){
      const c0 = Math.max(0, Math.min(C - 1, Math.round((x - x0)/cell))), ub = Bc[c0];
      const gap = (0.12 + 0.3*rf())*L*(1.3 - 0.6*sstep(-0.4, 0.3, at(FD, x, ub)));
      const hw = (0.003 + 0.003*rf())*L;
      const th = -TBA[c0] + (rf() - 0.5)*0.6, ax = Math.sin(th), au = Math.cos(th);
      if ((xm === null || Math.abs(x - xm) > 0.06*W) && Math.min(Math.abs(x), Math.abs(x - W)) > 0.08*W){
        for (let r = 0; r < R; r++){
          const u = uOf(r);
          if (u > ub + 0.1*W) break;
          const xc = x + (u - ub)*ax/Math.max(0.3, au), ca = Math.max(0, Math.floor((xc - 3*hw - x0)/cell)), cb = Math.min(C - 1, Math.ceil((xc + 3*hw - x0)/cell));
          for (let c = ca; c <= cb; c++){
            const q = Math.abs((xOf(c) - xc)*au), v = sstep(2*hw, 0.6*hw, q), k = r*C + c;
            if (v > RS[k]) RS[k] = v;
          }
        }
        info.ribs++;
      }
      x += gap;
    }
    for (let i = 0; i < n; i++) KE[i] *= 1 - RS[i];
  }
  // SG: the sand the shelf brings in, against what the waves take off a
  // beach: a fed stretch keeps a beach the drift can work, a starved one
  // goes back to bare rock.
  // The coast is a chain of littoral cells, each tens to a couple of
  // hundred km long and ended by a headland that stands out into deep
  // water, and each with its own supply: one is fed (old shelf sand, glacial
  // outwash, a river's), the next starved. So the supply changes at the
  // capes, not by a fade, and every coast has some of each: roughly a third
  // to two thirds of the cells fed (a third of the world's ice-free shore
  // is sandy), the rest left to the rock. A drowned stretch is starved
  // more, its sand caught in its estuaries.
  const rs = rng(0x5a9d01);
  const pFed = 0.35 + 0.35*rs(), sg0 = 0.3 + 0.5*rs();
  // (CID: the cell each column of the coast belongs to. A cell is closed:
  // its end is a headland the drift does not get round, its sand lost to
  // deep water off it, so the sand of one cell never reaches the next;
  // Inman and Frautschy, 1966. Its bays fill only with what its own shelf,
  // cliffs and rivers give it)
  const CID = new Int32Array(C);
  const cellAt = x => CID[Math.max(0, Math.min(C - 1, Math.round((x - x0)/cell)))];
  {
    // (the coast's seaward reach, column by column: the capes are its highs)
    // (and how resistant the rock is there: a cell ends at a headland of
    // sound rock standing out, as Portland Bill, Land's End, Point
    // Conception do)
    const reachC = new Float64Array(C);
    for (let c = 0; c < C; c++){
      let r = R - 1;
      while (r > 0 && PD[r*C + c] <= 0) r--;
      reachC[c] = uOf(r) - Bc[c] + 0.04*L*Math.max(H[r*C + c], HD[r*C + c]);
    }
    // (the cells' ends: laid out along the coast at lengths drawn between
    // some 0.05 and 0.4 of the waves' length, each moved to the cape that
    // stands furthest out near it)
    const ends = [], wcap = Math.max(2, Math.round(0.05*L/cell));
    for (let x = x0 - 0.05*L*rs(); x < xOf(C - 1); ){
      const c0 = Math.round((x - x0)/cell);
      let bc = Math.max(0, Math.min(C - 1, c0)), bv = -Infinity;
      for (let c = Math.max(0, c0 - wcap); c <= Math.min(C - 1, c0 + wcap); c++) if (reachC[c] > bv){ bv = reachC[c]; bc = c; }
      if (!ends.length || bc > ends[ends.length - 1]) ends.push(bc);
      x = xOf(bc) + L*0.05*Math.exp(Math.log(8)*rs());
    }
    ends.push(C);
    // (and each cell's supply: none, or a share of the coast's)
    const SC = new Float64Array(C);
    for (let k = 0, c = 0; k < ends.length; k++){
      const v = rs() < pFed ? sg0*(0.5 + 0.5*rs()) : 0;
      for (; c < ends[k] && c < C; c++){ SC[c] = v; CID[c] = k; }
    }
    // (the change across a cape, over a cell's few km of it)
    const SB = new Float64Array(C), kb = Math.max(1, Math.round(0.005*L/cell));
    for (let c = 0; c < C; c++){ let s = 0, m = 0; for (let j = c - kb; j <= c + kb; j++) if (j >= 0 && j < C){ s += SC[j]; m++; } SB[c] = s/m; }
    for (let i = 0; i < n; i++) SG[i] = SB[i % C]*(1 - 0.6*RG[i]);
  }

  // -- the coast as it lies: water the sea cannot reach is land on this map
  // (a lagoon behind its barrier is filled), the mainland apart from the
  // islands --
  const LND = U8(n), MAIN = U8(n), stk = I32(n), FIL = U8(n);
  for (let i = 0; i < n; i++) LND[i] = PD[i] > 0 ? 1 : 0;
  const reach = (A0, val, fromTop, OUT) => {
    let sp = 0;
    const r0 = fromTop ? 0 : R - 1;
    OUT.fill(0);
    for (let c = 0; c < C; c++){ const i = r0*C + c; if (A0[i] === val){ OUT[i] = 1; stk[sp++] = i; } }
    while (sp){
      const i = stk[--sp], r = (i/C)|0, c = i - r*C;
      if (c > 0 && !OUT[i - 1] && A0[i - 1] === val){ OUT[i - 1] = 1; stk[sp++] = i - 1; }
      if (c < C - 1 && !OUT[i + 1] && A0[i + 1] === val){ OUT[i + 1] = 1; stk[sp++] = i + 1; }
      if (r > 0 && !OUT[i - C] && A0[i - C] === val){ OUT[i - C] = 1; stk[sp++] = i - C; }
      if (r < R - 1 && !OUT[i + C] && A0[i + C] === val){ OUT[i + C] = 1; stk[sp++] = i + C; }
    }
  };
  {
    const SEA = U8(n);
    reach(LND, 0, false, SEA);
    for (let i = 0; i < n; i++) if (!LND[i] && !SEA[i]){ LND[i] = 1; FIL[i] = 1; }
  }
  reach(LND, 1, true, MAIN);
  // (the rock: the land as drawn but for the sand the sea has laid on it)
  const ROCK = U8(n);
  for (let i = 0; i < n; i++) ROCK[i] = LND[i] && !FIL[i] && !sandIn[i] ? 1 : 0;

  // -- the line's mask: the mainland, its field's edges kept as on a
  // graded coast --
  const M = U8(n), BF = U8(n), G = F32(n), T = F32(n), qx = F32(n), qy = F32(n), SD = F32(n);
  for (let i = 0; i < n; i++) M[i] = MAIN[i];
  for (const c of [0, C - 1]) for (let r = 0; r < R; r++) M[r*C + c] = uOf(r) < Bc[c] ? 1 : 0;
  const GR = 4;
  const edges = () => { for (let k = 0; k < GR*C; k++){ M[k] = 1; M[n - 1 - k] = 0; } };
  const uLo = uOf(GR + 2), uHi = uOf(R - GR - 3);
  edges();
  const flood = (val, fromTop, mark) => {
    let sp = 0;
    const r0 = fromTop ? 0 : R - 1;
    for (let c = 0; c < C; c++){ const i = r0*C + c; if (M[i] === val){ M[i] = mark; stk[sp++] = i; } }
    while (sp){
      const i = stk[--sp], r = (i/C)|0, c = i - r*C;
      if (c > 0 && M[i - 1] === val){ M[i - 1] = mark; stk[sp++] = i - 1; }
      if (c < C - 1 && M[i + 1] === val){ M[i + 1] = mark; stk[sp++] = i + 1; }
      if (r > 0 && M[i - C] === val){ M[i - C] = mark; stk[sp++] = i - C; }
      if (r < R - 1 && M[i + C] === val){ M[i + C] = mark; stk[sp++] = i + C; }
    }
  };
  // (SF: land made so by closing it off, a bay sealed or water cut off, not
  // laid by the waves)
  const SF = U8(n);
  // (mver counts the changes to the mask, so what is worked out from it
  // is worked out again only when it has changed)
  let mver = 0;
  const clean = () => {
    edges();
    flood(0, false, 2);
    let ch = 0;
    for (let i = 0; i < n; i++){ if (M[i] === 0){ M[i] = 1; SF[i] = 1; ch++; } else if (M[i] === 2) M[i] = 0; }
    flood(1, true, 3);
    for (let i = 0; i < n; i++){ if (M[i] === 1){ M[i] = 0; ch++; } else if (M[i] === 3) M[i] = 1; }
    if (ch) mver++;
  };
  clean();

  // -- the shore as a line, traced, laid out evenly and laid back on the
  // grid: as on a graded coast --
  const trace = () => traceShore(M, G, T, C, R, xOf, uOf);
  // (laid out again at even steps, carrying along it what each point holds:
  // its beach and the work done on it)
  const resample = (X, U, ds, P1, P2) => {
    const N = X.length, Ls = new Float64Array(N);
    for (let i = 1; i < N; i++) Ls[i] = Ls[i - 1] + hyp(X[i] - X[i - 1], U[i] - U[i - 1]);
    const M2 = Math.max(4, Math.round(Ls[N - 1]/ds) + 1), st = Ls[N - 1]/(M2 - 1);
    const X2 = new Float64Array(M2), U2 = new Float64Array(M2), A2 = new Float64Array(M2), B2 = new Float64Array(M2);
    let k = 0;
    for (let m = 0; m < M2; m++){
      const s = m*st;
      while (k < N - 2 && Ls[k + 1] < s) k++;
      const t = Math.min(1, Math.max(0, (s - Ls[k])/Math.max(1e-9, Ls[k + 1] - Ls[k])));
      X2[m] = X[k] + (X[k + 1] - X[k])*t; U2[m] = U[k] + (U[k + 1] - U[k])*t;
      if (P1){ A2[m] = P1[k] + (P1[k + 1] - P1[k])*t; B2[m] = P2[k] + (P2[k + 1] - P2[k])*t; }
    }
    X2[M2 - 1] = X[N - 1]; U2[M2 - 1] = U[N - 1];
    if (P1){ A2[M2 - 1] = P1[N - 1]; B2[M2 - 1] = P2[N - 1]; }
    return { X: X2, U: U2, B: A2, D: B2 };
  };
  const raster = (X, U) => { rasterShore(M, X, U, C, R, x0, u0, cell, uOf); mver++; };
  // (the line laid back on the grid after a round of the work. Where it has
  // run across water, a bay a spit or bar of the drift's has reached over,
  // the water behind is filled: washover fans, flood-tide deltas, the
  // streams' silt and the marsh grown over them fill a back-barrier basin,
  // the end of Johnson's sequence, a bay sealed and filled. Kept open, these
  // stood on the map as lakes and lagoons, some far inland of a shore that
  // had moved on past them)
  const relay = ln => { raster(ln.X, ln.U); clean(); };
  // (a short smoothing, to take the grid's steps out of a traced line: on
  // its sand only, where the sand stands a cell wide or more, so that it
  // never eases a point back into the rock behind a thin beach; bare rock
  // keeps the shape it was traced with)
  const ease = (X0, U0, steps, ds, B) => {
    const X = Float64Array.from(X0), U = Float64Array.from(U0);
    const N = X.length, V = new Float64Array(N);
    for (let s = 0; s < steps; s++){
      for (let i = 1; i < N - 1; i++){
        const h0 = hyp(X[i] - X[i - 1], U[i] - U[i - 1]) || 1e-9, h1 = hyp(X[i + 1] - X[i], U[i + 1] - U[i]) || 1e-9;
        const ax = (X[i + 1] - X[i])/h1 - (X[i] - X[i - 1])/h0, au = (U[i + 1] - U[i])/h1 - (U[i] - U[i - 1])/h0;
        let tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9; tx /= tl; tu /= tl;
        V[i] = 0.2*ds*ds*2*(ax*(-tu) + au*tx)/(h0 + h1)*sstep(cell, 2*cell, B[i]);
      }
      for (let i = 1; i < N - 1; i++){
        const tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9;
        X[i] += V[i]*(-tu/tl); U[i] += V[i]*(tx/tl);
      }
      U[0] = U[1]; U[N - 1] = U[N - 2];
    }
    return { X, U };
  };
  // (what each point of a new line holds, from the nearest point of the old)
  const carry = (nl, ol) => {
    const BIN = 4*Math.max(cell, ds), map = new Map(), key = (x, u) => Math.floor(x/BIN)*65536 + Math.floor(u/BIN);
    for (let i = 0; i < ol.X.length; i++){ const k = key(ol.X[i], ol.U[i]); let a = map.get(k); if (!a){ a = []; map.set(k, a); } a.push(i); }
    const N = nl.X.length;
    nl.B = new Float64Array(N); nl.D = new Float64Array(N);
    for (let i = 0; i < N; i++){
      const x = nl.X[i], u = nl.U[i], kx = Math.floor(x/BIN), ku = Math.floor(u/BIN);
      let best = -1, bd = Infinity;
      for (let dx = -1; dx <= 1; dx++) for (let du = -1; du <= 1; du++){
        const a = map.get((kx + dx)*65536 + ku + du);
        if (a) for (const j of a){ const d = (ol.X[j] - x)*(ol.X[j] - x) + (ol.U[j] - u)*(ol.U[j] - u); if (d < bd){ bd = d; best = j; } }
      }
      if (best < 0) for (let j = 0; j < ol.X.length; j++){ const d = (ol.X[j] - x)*(ol.X[j] - x) + (ol.U[j] - u)*(ol.U[j] - u); if (d < bd){ bd = d; best = j; } }
      nl.B[i] = ol.B[best]; nl.D[i] = ol.D[best];
      // (a point laid where the old line was not, across a bay's mouth, is
      // the barrier's: as wide a beach as the sand that built it, newly
      // worked)
      if (bd > 4*ds*ds) nl.B[i] = Math.max(nl.B[i], bref, -at(RD, x, u)*cell - 0.7*cell);
    }
    return nl;
  };

  // (bref: a barrier's width, in plan; bav: the beach the drift needs to
  // run at full strength, far narrower: a beach of a hundred metres or two
  // carries all the drift the waves can drive along it)
  const ds = L/360, bref = 0.5*ds, bav = 0.12*ds;
  // (the steps of the work, as on a graded coast, and how fast bare rock
  // wears in each: over the whole of the work, the softest, loose sediment
  // standing square to the waves goes back as far as a graded coast's
  // sandy shore does between its fixed points, some 0.03 L; weak rock a
  // tenth of that, hard rock nothing a map would show, as a till cliff
  // goes back metres a year and granite a millimetre)
  const NS0 = Math.round(Math.pow(0.15*L, 2)/((hiA ? 0.24 : 0.12)*ds*ds)), NSW = NS0*(1 + 1/12);
  const ek = 0.03*L/(0.6*NSW), er0 = loss*ds, NSR = NS0/4;
  // (how much of the drift a beach of width b can carry: none off bare rock)
  const av = b => b <= 0 ? 0 : b >= bav ? 1 : (b/bav)*(b/bav)*(3 - 2*b/bav);
  // (how fast a beach of width b lets the waves wear the rock behind it,
  // against bare rock: a thin beach is their tools and wears it faster, a
  // broad one keeps them off it)
  const wearOf = b => { const q = Math.max(0, b)/bav; return (1 + 5*q)*Math.exp(-2.2*q); };

  // -- the bays the sand closes, and how far --
  // A bay is closed only by sand the drift brings to it, and that sand is
  // spent: it is not there for the next bay along. So the coast is worked
  // as littoral cells. Each point of the shore gives the drift what its
  // beach holds and what reaches it in a round of the work (the shelf's
  // sand, the sand of its cliffs worn back, a river's); the drift carries
  // it along the coast the way the waves drive it; a cape standing out
  // into deep water passes little of it on, losing the rest offshore (a
  // cell's end); and each bay the drift reaches takes what it needs of it.
  // Downdrift of a fed or soft stretch the bays fill; past a deep cape, or
  // along hard, starved rock, they stay open as they drowned.
  // What the sand builds lies along the shape the waves hold a bay's beach
  // to between two headlands in static equilibrium, the parabolic bay
  // shape (Hsu and Evans, 1989): from the updrift headland's tip, the point
  // the waves bend round, at an angle theta off the incoming crests,
  //   R/R0 = C0 + C1 (beta/theta) + C2 (beta/theta)^2,   beta <= theta <= 180,
  // R0 the line from that tip to the downdrift headland, beta its angle off
  // the crests; downdrift of it the beach runs straight along the crests.
  // A curl in the updrift headland's lee, a long run to the next point, the
  // beach set back between the points by as much as the swell's slant
  // across them asks, not a lid laid from tip to tip. As far as the sand
  // reaches, the stages a drowned bay goes through (Johnson):
  //  - not enough to fill it: a spit from the updrift headland along that
  //    line, part way across the mouth, and sand in at the bay's head, a
  //    bayhead beach built out towards the mouth;
  //  - enough for all of it: the bay sealed, and filled out to the line.
  // Waves move sand only down to a few tens of metres (the closure depth),
  // so no spit is built across a mouth deeper than that: a deep ria stays
  // open, and the sand that reaches it all goes in at its head. Where the
  // drift itself carries the shore across a bay in the work below, the
  // water it closes off is filled behind it, as a back-barrier basin fills.
  let gateLine = null;
  let sver = -1, sb0 = 0, sb1 = 0;
  const SD1 = F32(n);
  // (the coefficients of the parabolic bay shape for beta = 10..80 degrees,
  // Hsu and Evans' fit to 27 bays as tabulated by Silvester and Hsu; each
  // row sums to one, R = R0 at theta = beta)
  const PB0 = [0.036, 0.050, 0.054, 0.064, 0.082, 0.096, 0.110, 0.134];
  const PB1 = [1.011, 0.998, 1.040, 0.995, 0.882, 0.746, 0.531, 0.311];
  const PB2 = [-0.047, -0.049, -0.094, -0.059, 0.037, 0.158, 0.359, 0.555];
  // (the closure depth, m: deeper than this the waves do not move the sand)
  const ZCL = 18;
  // (the net drift's way along the traced line, which runs left to right:
  // against the swell's slant off the normal)
  const dirn = (hiA ? side : sw0) > 0 ? -1 : 1;
  // (the budget: what each point of the line gives the drift in a round, in
  // km^2 of beach in plan as a barrier's need is counted, and the share of
  // the load the drift passes on past it)
  let AVline = null, AV = null, BY = null;
  // (a cape: a point standing out into the waves with deep water off it,
  // past the depth the waves move sand at. There the drift goes round only
  // in part, as it passes a headland that ends a littoral cell, and the sand
  // the waves stir off a beach is lost to the deep; in a bay or along a
  // shore with a shallow shelf off it, what they stir is kept, and moves
  // only along the shore. tx, tu: the shore's way, land on the left)
  const capeAt = (x, u, tx, tu) => {
    const z = Math.max(0, -at(E, x - 0.02*L*tu, u + 0.02*L*tx));
    return sstep(0.55, 0.75, at(EXPO, x, u))*sstep(ZCL, 50, z);
  };
  const budget = () => {
    if (AVline === gateLine) return;
    AVline = gateLine;
    const X = gateLine.X, U = gateLine.U, B = gateLine.B, N = X.length;
    AV = new Float64Array(N); BY = new Float64Array(N);
    for (let i = 0; i < N; i++){
      const x = X[i], u = U[i], a = Math.max(0, i - 1), b = Math.min(N - 1, i + 1);
      let tx = X[b] - X[a], tu = U[b] - U[a];
      const tl = hyp(tx, tu) || 1e-9; tx /= tl; tu /= tl;
      // (of the beach, only its active width: a strand plain or a filled
      // bay behind it is not sand the drift moves in a round)
      AV[i] = (Math.min(Math.max(0, B[i]), bref) + NSR*0.5*(er0*at(SG, x, u) + ek*at(KE, x, u)*at(FS, x, u)))*ds;
      BY[i] = Math.exp(-ds/(2*L) - capeAt(x, u, tx, tu)*ds/(0.01*L));
    }
    for (const m of RM){
      let bi = 0, bd = Infinity;
      for (let i = 0; i < N; i++){ const d = hyp(X[i] - m.x, U[i] - m.u); if (d < bd){ bd = d; bi = i; } }
      AV[bi] += m.q*NSR;
    }
  };
  const seal = rb => {
    const k = rb/cell, F = BF;
    // (worked out only over the rows the closing can reach: from the first
    // with any water to a closing's reach below the last with any land;
    // above them is all land, below all open sea)
    if (sver !== mver){
      let ra = 0, rz = R - 1;
