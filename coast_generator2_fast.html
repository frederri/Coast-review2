        KN[i] = at(KE, xi, ui); FN[i] = at(FS, xi, ui); SN2[i] = at(SG, x, u);
        // (a point standing out into the waves draws them onto it, as the
        // rays bend toward shallow water, and wears faster; the head of a
        // bay slower: how open it lies, as the front's speed-up above)
        const ex = at(EXPO, x, u);
        FO[i] = Math.min(1.8, Math.max(0.25, Math.pow(2*ex, 1.2)));
        TA[i] = -TBA[Math.max(0, Math.min(C - 1, Math.round((x - x0)/cell)))];
        DP[i] = 1 + Math.max(0, -at(E, x - 3*tu, u + 3*tx))/20;
        LO[i] = capeAt(x, u, tx, tu);
        ZF[i] = Math.max(0, -at(E, x - ds*tu, u + ds*tx));
        CL[i] = cellAt(x);
      }
      for (let m = 0; m < RM.length; m++){
        let bi = 1, bd = Infinity;
        for (let i = 1; i < N - 1; i++){ const d = hyp(X[i] - RM[m].x, U[i] - RM[m].u); if (d < bd){ bd = d; bi = i; } }
        MI[m] = bi; RM[m].x = X[bi]; RM[m].u = U[bi];
      }
    };
    read();
    for (let s = 0; s < steps; s++){
      if (s % 16 === 0){
        let lo = 1e9, hi = 0;
        for (let i = 1; i < N; i++){ const h = hyp(X[i] - X[i - 1], U[i] - U[i - 1]); if (h < lo) lo = h; if (h > hi) hi = h; }
        if (lo < 0.5*ds || hi > 1.8*ds){ const q = resample(X, U, ds, B, D); X = q.X; U = q.U; B = q.B; D = q.D; N = X.length; }
        let fin = 0;
        for (let i = 0; i < N; i++) fin += X[i] + U[i];
        if (!(N < N0*3) || !isFinite(fin)) return null;
        read();
      }
      let ar;
      if (sq) ar = swS*gauss(rnd);
      else if (hiA){ const hi = rnd() < Uh, mag = (hi ? 1 + rnd() : rnd())*0.25*PI; ar = (rnd() < Aw ? side : -side)*mag; }
      else ar = Math.max(-1.5, Math.min(1.5, sw0 + swS*gauss(rnd)));
      const sx = Math.sin(ar), su = Math.cos(ar);
      local();
      let pmin = 1e18, pmax = -1e18;
      for (let i = 0; i < N; i++){ const p = XL[i]*su - UL[i]*sx; PB[i] = p; if (p < pmin) pmin = p; if (p > pmax) pmax = p; }
      const nb = Math.min(QB.length, 2*N + 8), bw = Math.max(0.5*ds, (pmax - pmin)/(nb - 1));
      for (let b = 0; b < nb; b++) QB[b] = -1e18;
      for (let i = 0; i < N - 1; i++){
        const q = Math.max(XL[i]*sx + UL[i]*su, XL[i + 1]*sx + UL[i + 1]*su);
        const b0 = Math.floor((Math.min(PB[i], PB[i + 1]) - pmin)/bw), b1 = Math.floor((Math.max(PB[i], PB[i + 1]) - pmin)/bw);
        for (let b = b0; b <= b1; b++) if (q > QB[b]) QB[b] = q;
      }
      for (let i = 0; i < N - 1; i++){
        const xm2 = 0.5*(XL[i] + XL[i + 1]), um = 0.5*(UL[i] + UL[i + 1]);
        const b = Math.floor((0.5*(PB[i] + PB[i + 1]) - pmin)/bw);
        LT[i] = QB[b] > xm2*sx + um*su + 3*ds ? 0 : 1;
      }
      for (let i = 0; i < N - 1; i++){
        const dx = X[i + 1] - X[i], du = U[i + 1] - U[i];
        HS[i] = hyp(dx, du) || 1e-9;
        // (a stretch in the lee has no direct waves, whatever its angle)
        if (!LT[i]){ Q[i] = 0; PW[i] = 0; continue; }
        let ph = ar + 0.5*(TA[i] + TA[i + 1]) - Math.atan2(-du, dx);
        ph -= 2*PI*Math.round(ph/(2*PI));
        const c = Math.cos(ph);
        if (c <= 0){ Q[i] = 0; PW[i] = 0; LT[i] = 0; continue; }
        Q[i] = -kq*Math.pow(c, 1.2)*Math.sin(ph);
        PW[i] = c;
      }
      const dn = sx > 0 ? -1 : 1;
      for (let k = 0, j = -1; k < N - 1; k++){
        const i = dn > 0 ? k : N - 2 - k;
        if (LT[i]){ j = dn > 0 ? i + 1 : i; continue; }
        if (j < 0) continue;
        const fx = XL[j] - 0.5*(XL[i] + XL[i + 1]), fu = UL[j] - 0.5*(UL[i] + UL[i + 1]), cd = (fx*sx + fu*su)/(hyp(fx, fu) || 1e-9);
        if (cd <= 0) continue;
        let ph = Math.atan2(fx, fu) + 0.5*(TA[i] + TA[i + 1]) - Math.atan2(-(U[i + 1] - U[i]), X[i + 1] - X[i]);
        ph -= 2*PI*Math.round(ph/(2*PI));
        const c = Math.cos(ph), kd = 0.2*cd*cd*cd;
        if (c <= 0) continue;
        Q[i] = -kq*kd*Math.pow(c, 1.2)*Math.sin(ph);
        PW[i] = kd*c;
      }
      // (the drift carries what the beach it leaves holds, and none past a
      // cell's end)
      for (let i = 0; i < N - 1; i++) if (Q[i] !== 0) Q[i] = CL[i] === CL[i + 1] ? Q[i]*av(Q[i] > 0 ? B[i] : B[i + 1]) : 0;
      for (let i = 1; i < N - 1; i++){
        const h0 = HS[i - 1], h1 = HS[i];
        const ax = (X[i + 1] - X[i])/h1 - (X[i] - X[i - 1])/h0, au = (U[i + 1] - U[i])/h1 - (U[i] - U[i - 1])/h0;
        let tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9; tx /= tl; tu /= tl;
        KP[i] = 2*(ax*(-tu) + au*tx)/(h0 + h1);
        const pw = 0.5*(PW[i - 1] + PW[i]);
        const a = av(B[i]);
        V[i] = -2*(Q[i] - Q[i - 1])/(h0 + h1) + er*pw*(SN2[i]*(1 - a) - a*LO[i]);
      }
      for (let m = 0; m < RM.length; m++){
        const i0 = MI[m], q = RM[m].q;
        for (let j = -2; j <= 2; j++){ const i = i0 + j; if (i > 0 && i < N - 1) V[i] += q*RIVER_SPREAD[j + 2]/HS[i]; }
      }

      for (let i = 1; i < N - 1; i++){
        const a = Math.max(0, i - 1), b = Math.min(N - 1, i + 1);

        // shoreface's smoothing, which no beach can lose more than it holds)
        // (over deep water the shore moves the more slowly, building out or
        // going back alike: as much sand is laid or taken for each km)
        let v = (V[i] - nu*av(B[i])*(KP[b] - 2*KP[i] + KP[a]))/DP[i];
        v = Math.max(-0.25*ds, Math.min(0.25*ds, v));
        // (and it builds out only where the water before it is shallow
        // enough to build a shoreface up from: sand driven on past the
        // closure depth falls down the slope and is gone. A spit runs out
        // along a shallow shelf or a bar, and stops where the bottom drops
        // away, as at a deep gulf's mouth)

        // (no waves on it, or no beach: wearOf would be multiplied by nought,
        // or is exactly 1)
        const pw = 0.5*(PW[i - 1] + PW[i]), e = pw === 0 ? 0 : ek*KN[i]*pw*FO[i]*(B[i] > 0 ? wearOf(B[i]) : 1);
        const sand = FN[i]*e;
        if (B[i] + v + sand < 0) v = -(B[i] + sand);
        B[i] += v + sand;
        V[i] = v - e;
        // (how far the rock has been worn back here)
        D[i] += e;
      }
      for (let i = 1; i < N - 1; i++){
        const tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9;
        X[i] += V[i]*(-tu/tl); U[i] += V[i]*(tx/tl);
      }
      U[0] = U[1]; U[N - 1] = U[N - 2];
      for (let i = 0; i < N; i++){ if (U[i] < uLo) U[i] = uLo; else if (U[i] > uHi) U[i] = uHi; }
    }
    return resample(X, U, ds, B, D);
  };

  // -- the work --
  const lost = what => console.warn('Mixed coast: ' + what + ', the coast is left as it stood (seed ' + seed + ')');
  let line = trace();
  if (!line) lost('no shore to trace');
  // (the rock as a signed distance, km, positive inside: how wide the
  // beach is that a point of the shore stands on)
  const RD = F32(n);
  for (let i = 0; i < n; i++) G[i] = ROCK[i] ? 1 : -1;
  sdf(G, C, R, RD, qx, qy);
  if (line){
    line = resample(line.X, line.U, ds);
    const N = line.X.length;
    line.B = new Float64Array(N); line.D = new Float64Array(N);
    for (let i = 0; i < N; i++) line.B[i] = Math.max(0, -at(RD, line.X[i], line.U[i])*cell - 0.7*cell);
    // the rivers, as on a graded coast: the greatest few, their sand a
    // supply some coasts have much of and others little
    if (A){
      // (a fifth of what a graded coast's rivers bring: there they build the
      // great bulges of a delta coast; here a river's sand is a local
      // source, a bayhead delta or a fed stretch either side of its mouth,
      // not enough to bury the coast for hundreds of km)
      const rr = rng(0x0de17a), q0 = rr() < 0.7 ? 0.2*(0.02 + 0.065*rr())*ds*ds : 0;
      const X = line.X, U = line.U, AM = new Float64Array(N);
      for (let i = 1; i < N - 1; i++){
        let tx = X[i + 1] - X[i - 1], tu = U[i + 1] - U[i - 1];
        const tl = hyp(tx, tu) || 1e-9; tx /= tl; tu /= tl;
        for (let k = 1; k <= 8; k++){
          const d = k*0.004*L, x = X[i] + tu*d, u = U[i] - tx*d;
          const c = Math.round((x - x0)/cell), r = Math.round((u - u0)/cell);
          if (c >= 0 && c < C && r >= 0 && r < R && A[r*C + c] > AM[i]) AM[i] = A[r*C + c];
        }
      }
      const cand = [], wn = Math.max(2, Math.round(0.04*L/ds));
      for (let i = wn; i < N - wn; i++){
        if (X[i] < -0.05*W || X[i] > 1.05*W) continue;
        let top = true;
        for (let j = i - wn; j <= i + wn && top; j++) if (AM[j] > AM[i]) top = false;
        if (top && AM[i] > 0) cand.push(i);
      }
      cand.sort((a, b) => AM[b] - AM[a]);
      const amax = cand.length ? AM[cand[0]] : 0;
      for (const i of cand){
        if (RM.length >= 3 || AM[i] < 0.25*amax || q0 <= 0) break;
        if (RM.some(m => Math.abs(m.x - X[i]) < 0.08*L) || (pins && pins.some(p => Math.abs(X[i] - p) < 0.06*W))) continue;
        RM.push({ x: X[i], u: U[i], q: q0*Math.pow(AM[i]/amax, 0.7) });
      }
      info.rivers = RM.length;
    }
  }
  if (line){
    const kq = 0.3*ds*ds, er = er0, nu = 0.06*ds*ds, NS = NS0, NR = 4;
    // (bays already closed by the sand there is, before the work)
    gateLine = line;
    for (const rb of [0.2, 0.12, 0.06, 0.03, 0.015]) seal(rb*L);
    { const t = trace(); if (t){ const q = resample(t.X, t.U, ds); line = carry(q, line); } }
    for (let k = 0; k <= NR; k++){
      const st = k < NR ? Math.round(NS/NR) : Math.round(NS/(3*NR)), sq = k === NR && !hiA;
      let next = evolve(line, st, kq, er, ek, nu, 0x3a11 + k, sq);
      if (!next){ info.calm++; next = evolve(line, st, 0, er, ek, nu, 0x3a11 + k, sq); }
      if (!next){ lost('the shore ran wild'); break; }
      line = next;
      info.rounds++;
      if (k === NR) break;
      relay(line);
      gateLine = line;
      for (const rb of [0.2, 0.12, 0.06, 0.03, 0.015]) seal(rb*L);
      const t = trace();
      if (!t){ lost('the shore was lost between rounds'); break; }
      const q = carry(resample(t.X, t.U, ds), line), e2 = ease(q.X, q.U, 12, ds, q.B);
      line = carry(resample(e2.X, e2.U, ds), line);
    }
    relay(line);
    info.nodes = line.X.length;
  }

  // -- the line as it is left, as a signed distance in km: exact within a
  // few cells of it --
  const lineDist = (X, U, P, MK) => {
    for (let i = 0; i < n; i++) G[i] = MK[i] ? 1 : -1;
    sdf(G, C, R, P, qx, qy);
    const Bn = 4, DB = SD.fill(1e9);
    for (let k = 0; k + 1 < X.length; k++){
      const ax = X[k], au = U[k], dx = X[k + 1] - ax, du = U[k + 1] - au, L2 = dx*dx + du*du || 1e-12;
      const ca = Math.max(0, Math.floor((Math.min(ax, ax + dx) - x0)/cell) - Bn), cb = Math.min(C - 1, Math.ceil((Math.max(ax, ax + dx) - x0)/cell) + Bn);
      const ra = Math.max(0, Math.floor((Math.min(au, au + du) - u0)/cell) - Bn), rb = Math.min(R - 1, Math.ceil((Math.max(au, au + du) - u0)/cell) + Bn);
      for (let r = ra; r <= rb; r++){
        const u = uOf(r);
        for (let c = ca; c <= cb; c++){
          const x = xOf(c), t = Math.max(0, Math.min(1, ((x - ax)*dx + (u - au)*du)/L2));

          if (d < DB[i]) DB[i] = d;
        }
      }
    }
    for (let i = 0; i < n; i++){ if (DB[i] < Bn) P[i] = MK[i] ? Math.max(1e-3, DB[i]) : -Math.max(1e-3, DB[i]); P[i] *= cell; }
  };
  const P1 = F32(n), WK = F32(n);
  if (!line){ P1.set(PD); WK.fill(1); return { phi: P1, wk: WK, info }; }
  lineDist(line.X, line.U, P1, Uint8Array.from(M));

  // -- what each place along the coast holds, from its nearest point on the
  // line: the beach the work has laid there (NB), how far it has worn the
  // rock back (NW), and how much of the swell reaches it (NE) --
  const NB = F32(n), NW = F32(n), NE = F32(n);
  {
    const X = line.X, U = line.U, Bl = line.B, Dl = line.D, N = X.length;
    const MB = F32(n).fill(-1), MW = F32(n), ME = F32(n);
    // (the swell's reach, as a wave exposure index is reckoned from fetch:
    // from each point of the line, rays out over the water towards where the
    // swell comes from, across the spread of its directions; the share of
    // them that get out to open water, a tenth of the waves' length off,
    // without meeting land. Along an open shore and at a bay's head facing
    // its mouth, most; on the walls of a bay behind a narrow mouth, few)
    const EX = new Float64Array(N), FL = 0.1*L, NR = 9;
    for (let i = 0; i < N; i++){
      const c0 = Math.max(0, Math.min(C - 1, Math.round((X[i] - x0)/cell))), tb = TBA[c0];
      const ox = Math.cos(sw0)*(-Math.sin(tb)) + Math.sin(sw0)*Math.cos(tb), ou = Math.cos(sw0)*Math.cos(tb) + Math.sin(sw0)*Math.sin(tb);
      let out = 0;
      for (let k = 0; k < NR; k++){
        const a = (k/(NR - 1) - 0.5)*(2*PI/3), ca = Math.cos(a), sa = Math.sin(a);
        const dx = ox*ca - ou*sa, du = ox*sa + ou*ca;
        let ok = true;
        for (let d = 2*cell; d < FL && ok; d += cell){
          const gx = (X[i] + dx*d - x0)/cell, gy = (U[i] + du*d - u0)/cell;
          if (gx < 0 || gx > C - 1 || gy < 0 || gy > R - 1) break;
          if (P1[Math.round(gy)*C + Math.round(gx)] > 0) ok = false;
        }
        if (ok) out++;
      }
      EX[i] = out/NR;
    }
    let gr = 0, sw = 0;
    for (let i = 0; i < N; i++) if (X[i] >= 0 && X[i] <= W){ sw++; if (Bl[i] > bav) gr++; }
    info.graded = sw ? +(gr/sw).toFixed(2) : 0;
    // (laid on the cells the line crosses, then carried out by the distance
    // sweeps, each cell taking its nearest marked cell's)
    for (let i = 0; i + 1 < N; i++){
      const steps = Math.max(1, Math.ceil(hyp(X[i + 1] - X[i], U[i + 1] - U[i])/(0.5*cell)));
      for (let s = 0; s <= steps; s++){
        const t = s/steps, x = X[i] + (X[i + 1] - X[i])*t, u = U[i] + (U[i + 1] - U[i])*t;
        const c = Math.round((x - x0)/cell), r = Math.round((u - u0)/cell);
        if (c >= 0 && c < C && r >= 0 && r < R){ const k = r*C + c; MB[k] = Math.max(0, Bl[i] + (Bl[i + 1] - Bl[i])*t); MW[k] = Dl[i] + (Dl[i + 1] - Dl[i])*t; ME[k] = EX[i] + (EX[i + 1] - EX[i])*t; }
      }
    }
    const ex = F32(n), ey = F32(n);
    for (let i = 0; i < n; i++){ const c = i % C, r = (i - c)/C; if (MB[i] >= 0){ ex[i] = c; ey[i] = r; T[i] = 0; } else { ex[i] = 1e9; ey[i] = 1e9; T[i] = 1e18; } }
    const relax = (i, j, c, r) => { const qx2 = ex[j]; if (qx2 >= 1e9) return; const qy2 = ey[j], d = (qx2 - c)*(qx2 - c) + (qy2 - r)*(qy2 - r); if (d < T[i]){ T[i] = d; ex[i] = qx2; ey[i] = qy2; } };
    for (let r = 0; r < R; r++){
      for (let c = 0; c < C; c++){ const i = r*C + c; if (r > 0){ relax(i, i - C, c, r); if (c > 0) relax(i, i - C - 1, c, r); if (c < C - 1) relax(i, i - C + 1, c, r); } if (c > 0) relax(i, i - 1, c, r); }
      for (let c = C - 2; c >= 0; c--) relax(r*C + c, r*C + c + 1, c, r);

    for (let r = R - 1; r >= 0; r--){
      for (let c = C - 1; c >= 0; c--){ const i = r*C + c; if (r < R - 1){ relax(i, i + C, c, r); if (c > 0) relax(i, i + C - 1, c, r); if (c < C - 1) relax(i, i + C + 1, c, r); } if (c < C - 1) relax(i, i + 1, c, r); }
      for (let c = 1; c < C; c++) relax(r*C + c, r*C + c - 1, c, r);

    for (let i = 0; i < n; i++){ const k = ex[i] < 1e9 ? (ey[i]|0)*C + (ex[i]|0) : -1; NB[i] = k < 0 ? 0 : MB[k]; NW[i] = k < 0 ? 0 : MW[k]; NE[i] = k < 0 ? 1 : ME[k]; }
    blur3(NE, T, C, R, 2);
  }

  // -- the coast as it drowned and was cut, as true signed distances in km
  // (its own field is one only close in): the mainland's, and the islands' --
  const PIm = F32(n), PIi = F32(n);
  for (let i = 0; i < n; i++){ const a = Math.abs(PD[i]) || 1e-3; G[i] = MAIN[i] ? (PD[i] > 0 ? a : 0.5) : -a; }
  sdf(G, C, R, PIm, qx, qy);
  for (let i = 0; i < n; i++){ const a = Math.abs(PD[i]) || 1e-3; G[i] = LND[i] && !MAIN[i] ? a : -a; }
  sdf(G, C, R, PIi, qx, qy);
  for (let i = 0; i < n; i++){ PIm[i] *= cell; PIi[i] *= cell; }
  // -- the coast: the rock as the waves have worn it back, and the sand as
  // they have laid it. Each is land where it is: the rock wherever it still
  // stands, sound rock out as far as it reaches whatever the drift did along
  // the shore before it; the sand only where the work has a beach, from the
  // line in to the rock behind it, and across the bays it has sealed, the
  // water behind filled (a strip of beach alone left threads of water
  // between it and the rock, standing on the map as rivers). Where
  // the shore has no beach the line only follows the rock, and an inlet it
  // passed over at its own coarser steps is still open water. So a starved
  // stretch of hard rock is as rugged as it drowned, a fed one runs in arcs
  // from point to point with the rock standing out at the points, and
  // nothing is a mean of the two. The islands are worn by the same law as
  // the mainland's rock, bare and open all round for the whole of the work,
  // so a soft one goes and a hard one stays; off a sandy shore they are
  // buried in it or tied to the land --
  const P = F32(n);
  {
    // (the water the line has passed over, landward of it and short of the
    // rock: each body of it is one bay, and it is filled, or not, as one.
    // Left open only where it is an inlet the line was merely taken across
    // at its own coarser steps: the line meets it, bare of sand, and no sand
    // the drift has laid stands against it. Filled where it lies behind sand,
    // a barrier's, a spit's or a bayhead beach's, as back-barrier water is
    // (washover and flood-tide deltas, then marsh); left, it stood as a
    // channel winding between the sand and the rock, a river on the map.
    // Decided cell by cell, a bay half filled had a straight edge at the
    // change). And only where the waves reach: deep in a bay, past its
    // mouth, the swell is spread by diffraction and spent on the sides, and
    // what comes in drives no drift and grades nothing (the walls of a ria
    // stay rock, its sand gathers at the head; Johnson, Short and Masselink).
    // So in a bay the line runs deep into, walled in on all but its mouth,
    // the line's beach counts for nothing: the walls are the rock's, and the
    // only sand there is what the bays' sealing laid at the head. Graded
    // there, a drowned valley came out a round hole with smooth walls. (NE,
    // the swell's reach, above)
    const RK = F32(n), PK = I32(n).fill(-1), fill = [];
    for (let i = 0; i < n; i++) RK[i] = PIm[i] - NW[i];
    const open = i => NE[i] >= 0.3;
    const holds = i => NB[i] > bav && open(i);
    for (let i0 = 0; i0 < n; i0++){

    for (let i = 0; i < n; i++) T[i] = E[i] > 0 ? 0.5 : -0.5;
    sdf(T, C, R, D1, px, py);
    for (let i = 0; i < n; i++) T[i] = D1[i] > Ro ? 0.5 : -0.5;
    sdf(T, C, R, D2, px, py);
    for (let i = 0; i < n; i++){
      if (!OFF('open') && E[i] > 0 && !BAR[i] && !LAG[i] && D2[i] < -Ro && HD[i] < hthr && D0[i]*cell < emax && SN[i] > 0.35 && !(FB && FB[i])) E[i] = -4 - 3*D1[i];
    }
    // the envelope: the land closed over gaps narrower than 2 Rc, as a disc
    // rolling along the sea side sees it
    for (let i = 0; i < n; i++) T[i] = E[i] > 0 ? 0.5 : -0.5;
    sdf(T, C, R, D1, px, py);
    for (let i = 0; i < n; i++) T[i] = D1[i] > -Rc ? 0.5 : -0.5;
    sdf(T, C, R, D2, px, py);
    // (the land's pieces: a bay's headlands are on the mainland or a big
    // island, not an islet standing in its mouth)
    {
      LB.fill(-1); let sp = 0, id = 0; LS.length = 0;
      for (let i0 = 0; i0 < n; i0++){
        if (LB[i0] !== -1 || E[i0] <= 0) continue;
        let size = 0; stk[sp++] = i0; LB[i0] = id;
        while (sp){
          const i = stk[--sp], r = (i/C)|0, c = i - r*C; size++;
          for (let k = 0; k < 8; k++){ const rr = r + DR8[k], cc = c + DC8[k]; if (rr < 0 || rr >= R || cc < 0 || cc >= C) continue; const j = rr*C + cc; if (LB[j] === -1 && E[j] > 0){ LB[j] = id; stk[sp++] = j; } }
        }
        LS.push(size); id++;
      }
      // (the mainland: whatever reaches the top of the field, where it is all land)
      for (let c = 0; c < C; c++){ const k = LB[c]; if (k >= 0) LS[k] = 1e9; }
    }
    const bigLand = 1e8;
    // bays: water inside the envelope, each joined to the open sea
    lab.fill(-1);
    const comps = [];
    for (let i0 = 0; i0 < n; i0++){
      if (lab[i0] !== -1 || E[i0] > 0 || D2[i0] < Rc - 0.5) continue;
      const id = comps.length, cellsK = [], mouth = [];
      let sp = 0; stk[sp++] = i0; lab[i0] = id;
      while (sp){
        const i = stk[--sp], r = (i/C)|0, c = i - r*C;
        cellsK.push(i);
        let open = false;
        for (let k = 0; k < 4; k++){
          const rr = r + (k === 0 ? -1 : k === 1 ? 1 : 0), cc = c + (k === 2 ? -1 : k === 3 ? 1 : 0);
          if (rr < 0 || rr >= R || cc < 0 || cc >= C) continue;
          const j = rr*C + cc;
          if (E[j] > 0) continue;
          if (D2[j] < Rc - 0.5){ open = true; continue; }
          if (lab[j] === -1){ lab[j] = id; stk[sp++] = j; }
        }
        if (open) mouth.push(i);
      }
      comps.push({ cellsK, mouth });
    }
    for (const K2 of comps){
      const { cellsK, mouth } = K2;
      if (mouth.length < 2 || cellsK.length < 4) continue;
      // (the provinces of the equalised coast above have had their work done)
      if (PM5){ let nm = 0; for (const i of cellsK) if (PM5[i]) nm++; if (nm > 0.3*cellsK.length) continue; }
      // (a bay with islands in it is not drawn into one curve: the islands
      // shelter the shore behind them, which keeps its own shape, and sand
      // laid across to them would join them to the land in a knob)
      let isl = false;
      for (let q = 0; q < cellsK.length && !isl; q++){
        const i = cellsK[q], r = (i/C)|0, cc = i - r*C;
        if (cc > 0 && E[i - 1] > 0 && LS[LB[i - 1]] < 1e8) isl = true;
        else if (cc < C - 1 && E[i + 1] > 0 && LS[LB[i + 1]] < 1e8) isl = true;
        else if (r > 0 && E[i - C] > 0 && LS[LB[i - C]] < 1e8) isl = true;
        else if (r < R - 1 && E[i + C] > 0 && LS[LB[i + C]] < 1e8) isl = true;
      }
      if (isl) continue;
      // (an inland sea behind its strait is a sea of its own, not a bay; nor
      // is a lagoon a spit has already closed off)
      if (FB){ let nb = 0; for (const i of cellsK) if (FB[i]) nb++; if (nb > 0.2*cellsK.length) continue; }
      // (nor a gulf of the rifted edge: it keeps its own funnel)
      if (GF){ let ng = 0; for (const i of cellsK) if (GF[i]) ng++; if (ng > 0.2*cellsK.length) continue; }
      { let nl = 0; for (const i of cellsK) if (LAG[i]) nl++; if (nl > 0.05*cellsK.length) continue; }
      // the headlands: the mouth's ends, where it meets the land
      const ends = [];
      for (const i of mouth){
        const r = (i/C)|0, c = i - r*C;
        let nl = false;
        for (let k = 0; k < 8 && !nl; k++){ const rr = r + DR8[k], cc = c + DC8[k]; if (rr >= 0 && rr < R && cc >= 0 && cc < C){ const j = rr*C + cc; if (E[j] > 0 && LS[LB[j]] >= bigLand) nl = true; } }
        if (nl) ends.push(i);
      }
      if (ends.length < 2) continue;
      let bi = ends[0], bj = ends[1], bd = -1;
      const stp = Math.max(1, Math.floor(ends.length/60));
      for (let a = 0; a < ends.length; a += stp) for (let b = a + 1; b < ends.length; b += stp){
        const ia = ends[a], ib = ends[b], ra = (ia/C)|0, rb = (ib/C)|0, ca = ia - ra*C, cb = ib - rb*C;
        const d = (ra - rb)*(ra - rb) + (ca - cb)*(ca - cb);
        if (d > bd){ bd = d; bi = ia; bj = ib; }
      }
      const r1 = (bi/C)|0, c1 = bi - r1*C, r2 = (bj/C)|0, c2 = bj - r2*C;
      const P1x = xOf(c1), P1u = uOf(r1), P2x = xOf(c2), P2u = uOf(r2);
      const W = hyp(P2x - P1x, P2u - P1u);
      if (W < 2.5*cell) continue;
      const ex = (P2x - P1x)/W, eu = (P2u - P1u)/W;
      let mx = -eu, mu = ex, sm = 0;
      for (let k = 0; k < cellsK.length; k += 7){ const i = cellsK[k], r = (i/C)|0, c = i - r*C; sm += (xOf(c) - P1x)*mx + (uOf(r) - P1u)*mu; }
      if (sm < 0){ mx = -mx; mu = -mu; }
      // what reaches the mouth, and from where
      const hm = Math.max(2*cell, 0.12*W);
      const wv = wave(0.5*(P1x + P2x) - mx*hm, 0.5*(P1u + P2u) - mu*hm);
      let sig = 0;
      for (const i of mouth) sig += SN[i];
      sig /= mouth.length;
      // (no sand, nothing to build: an ice-scoured coast keeps its troughs)
      // (a Jagged coast has little sand: its bays keep their drowned shape,
      // the sounds between its islands stay open, and only a well-fed bay
      // fills)
      if (wv.e < 0.16 || sig < (glac ? 0.5 : jag ? 0.42 : 0.12)) continue;
      // The waves at the mouth: their travel, and how slanted their crests
      // lie across the mouth's line (beta). The headland they come past
      // first is the updrift one, U: the frame runs along the mouth from it
      // to the other (A), and in (N). (A mouth the waves do not look into is
      // taken as met nearly square on.)
      const wx = -wv.fx, wu = -wv.fu, q = wx*ex + wu*eu, inw = wx*mx + wu*mu;
      const upAtP1 = q >= 0;
      const Ux = upAtP1 ? P1x : P2x, Uu = upAtP1 ? P1u : P2u, iU = upAtP1 ? bi : bj;
      const Ax = upAtP1 ? ex : -ex, Au = upAtP1 ? eu : -eu;
      const sb = inw > 0.05 ? Math.min(0.9, Math.abs(q)) : 0.12, cb = Math.sqrt(1 - sb*sb);
      const wX = sb*Ax + cb*mx, wU = sb*Au + cb*mu, cX = cb*Ax - sb*mx, cU = cb*Au - sb*mu;
      // The shape the waves hold a bay's beach to when no more sand comes in
      // (static equilibrium): a straight beach from the far headland lying
      // along the crests, so that they break square on to it all along; and
      // in the lee of U, where the crests bend round its point and spread
      // into its shadow, a curl that follows them round in towards the
      // point, closing in as it goes (a spiral about the point: the beach
      // meets each bent crest at the same angle). The more slanted the
      // waves, the further in the straight beach lies and the deeper the
      // bay. (+: how far past that shore, landward, in km)
      const COTA = 0.47;
      const past = (x, u, y0) => {
        const dx = x - Ux, du = u - Uu, xc = dx*cX + du*cU, yw = dx*wX + du*wU;
        if (xc >= 0) return yw - y0;
        return Math.sqrt(xc*xc + yw*yw) - y0*Math.exp(-Math.atan2(-xc, yw)*COTA);
      };
      const ys = W*sb;
      let Ymax = 0, far = 0, nbeh = 0;
      for (const i of cellsK){
        const r = (i/C)|0, c = i - r*C, x = xOf(c), u = uOf(r);
        const yw = (x - Ux)*wX + (u - Uu)*wU;
        if (yw > Ymax) Ymax = yw;
        const p = past(x, u, ys);
        if (p > 0){ nbeh++; if (p > far) far = p; }
      }
      if (!nbeh) continue;
      // Sand coming along the coast from beyond U: as much as the waves can
      // drive along it (most with their crests slanted some 45 degrees to
      // it, and going with the wave height to the power 2.5), where there is
      // sand to drive, m3 a year. It gets round U only if the water off U's
      // point is shallow, within the depth the waves still move sand at (the
      // depth of closure, some 1.6 times the year's biggest waves, which run
      // at a little over twice the usual): off a point standing in deeper
      // water the sand is lost down the slope, and the bay beyond is closed
      // off, with only its own sand.
      // (the depth just off the point, a km or two out, from how steeply the
      // floor falls away round it: the grid is too coarse to hold it itself)
      const Hw = Hs0*wv.e/0.86, hc = 3.5*Hw;
      let dmx = 0;
      {
        const r = (iU/C)|0, c = iU - r*C;
        for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++){
          const rr = r + dr, cc = c + dc;
          if (rr >= 0 && rr < R && cc >= 0 && cc < C && E[rr*C + cc] <= 0) dmx = Math.max(dmx, -E[rr*C + cc]);
        }
      }
      const dTip = 1.5*Math.max(0, dmx - Math.max(0, -E[iU]))/(2*cell);
      const byp = sstep(1.5, 0.8, dTip/hc);
      const Qd = inw > 0.05 ? 1e5*Math.pow(Hw, 2.5)*2*sb*cb*SN[iU]*byp : 0;
      // A bay far deeper than that shape, fed well from beyond U: the sand
      // does not turn in after the shore but runs on the way it was going,
      // out from U as a spit. Its line is the one along which the waves
      // drive the most sand, some 42 degrees off their crests, turned down
      // the drift: into the bay when they come in near square, straight
      // across its mouth at 42 degrees, and out from it when more slanted
      // still. It is as long as the sand that has come by since the sea came
      // to stand here will build, laid up from the floor it stands on (the
      // deeper the water, the more each km takes); where it runs out of
      // sand the waves bending round its tip curl it in, a hook. If it
      // reaches the far shore it stays open there, an inlet as wide as the
      // tide flowing in and out of the lagoon behind needs, unless that flow
      // is too small to keep the gap clear of the sand coming by; then the
      // spit closes it off, and the lagoon is a lake.
      if (Qd > 5e4 && W >= 6*cell && far > 2*cell && nbeh > 0.12*cellsK.length){
        const phs = Math.max(-0.14, 0.733 - Math.asin(sb));
        const Vav = Qd*(3 + 4*age)*1000*kr*kr, WSP = 1500*kr, BCR = 4;
        // (the lagoon a spit this long closes off: the bay's water in its
        // lee, out to its tip; the tide's prism is that area times the range)
        const d0X = Math.cos(phs)*Ax + Math.sin(phs)*mx, d0U = Math.cos(phs)*Au + Math.sin(phs)*mu;
        const nX = -Math.sin(phs)*Ax + Math.cos(phs)*mx, nU = -Math.sin(phs)*Au + Math.cos(phs)*mu;
        const leeS = [];
        for (const i of cellsK){
          const r = (i/C)|0, c = i - r*C, dx = xOf(c) - Ux, du = uOf(r) - Uu;
          if (dx*nX + du*nU > 0) leeS.push(dx*d0X + du*d0U);
        }
        leeS.sort((p, q2) => p - q2);
        let kLee = 0;
        const cA = cell*cell*1e6;
        let prism = 0, bruun = 1e9, gIn = 1.2;
        // (the inlet's throat: its section O'Brien's 6.6e-5 of the prism, m2,
        // deeper the bigger it is; its width at least a cell, to be seen)
        const setInlet = sNow => {
          while (kLee < leeS.length && leeS[kLee] <= sNow) kLee++;
          prism = kLee*cA*tide; bruun = prism/Qd;
          const Ac = 6.6e-5*prism;
          gIn = Math.max(1.2, Ac/(6 + 0.02*Math.sqrt(Ac))/(cell*1000));
        };
        // (how far the far shore lies ahead of the tip, looking along its way
        // and some 40 degrees to either side)
        const ahead = (x0, u0, a0) => {
          let best = 1e9;
          for (const da of [-0.7, -0.35, 0, 0.35, 0.7]){
            const dX = Math.cos(a0 + da)*Ax + Math.sin(a0 + da)*mx, dU = Math.cos(a0 + da)*Au + Math.sin(a0 + da)*mu;
            for (let f = 0.5; f <= gIn + 1; f += 0.5){
              const c = colOf(x0 + dX*f*cell), r = rowOf(u0 + dU*f*cell);
              if (E[r*C + c] > 0 && !BAR[r*C + c]){ if (f < best) best = f; break; }
            }
          }
          return best;
        };
        // (never much over some seventy km: the longest spits on Earth are
        // about a hundred, and one that long across a map of thousands of km
        // read as a claw)
        const st = 0.3*cell, Lmax = Math.min(1.3*W, 70);
        // (each spit's end its own: some run out straight, most curl in, as
        // tight or as wide and as far round as its own waves bend; one hook
        // of the same size and turn on every spit read as a stamp)
        const hq = hsh(iU, 91, seed ^ 0x51f7), hk = hq > 0.3, Rf = 0.06 + 0.16*hsh(iU, 92, seed ^ 0x51f7), Ah = 0.7 + 1.3*hsh(iU, 93, seed ^ 0x51f7);
        const pl = [], sL = [];
        {
          const r0 = (iU/C)|0, c0 = iU - r0*C;
          for (const k of [1, 3, 4, 6, 0, 2, 5, 7]){
            const rr = r0 + DR8[k], cc = c0 + DC8[k];
            if (rr >= 0 && rr < R && cc >= 0 && cc < C && E[rr*C + cc] > 0){ pl.push(xOf(cc), uOf(rr)); sL.push(-cell); break; }
          }
        }
        pl.push(Ux, Uu); sL.push(0);
        // (it sets out along the coast it comes from, the mouth's line, and
        // swings round towards that line of most drift as it grows)
        const Lr = 0.35*W;
        let x = Ux, u = Uu, s = 0, V = 0, ang = 0, hook = false, hs = 0, Rh = cell, trunk = 0, closed = false;
        for (let guard = 0; guard < 4000; guard++){
          if (!hook) ang = phs*(1 - Math.exp(-s/Lr));
          const dX = Math.cos(ang)*Ax + Math.sin(ang)*mx, dU = Math.cos(ang)*Au + Math.sin(ang)*mu;
          const nx = x + dX*st, nu = u + dU*st, c = colOf(nx), r = rowOf(nu), i = r*C + c;
          if (c <= 0 || c >= C - 1 || r <= 0 || r >= R - 1) break;
          if (!hook) setInlet(s);
          if (!hook && s > cell && ahead(nx, nu, ang) < gIn){
            if (bruun < 50){
              // (closed off: on to the shore)
              let xx = nx, uu = nu;
              for (let k = 0; k < 40; k++){
                pl.push(xx, uu); s += st; sL.push(s);
                if (E[rowOf(uu)*C + colOf(xx)] > 0) break;
                xx += dX*st; uu += dU*st;
              }
              closed = true;
            }
            break;
          }
          if (E[i] > 0 && s > 2*cell) break;
          V += WSP*(Math.max(1, -E[i]) + BCR)*st*1000;
          x = nx; u = nu; s += st;
          pl.push(x, u); sL.push(s);
          if (!hook && (V >= Vav || s >= Lmax)){ if (!hk){ trunk = s; break; } hook = true; trunk = s; Rh = Math.max(1.2*cell, Rf*s); }
          if (hook){ ang += st/Rh; hs += st; if (hs > Ah*Rh) break; }
        }
        if (!trunk) trunk = s;
        // (its lee: the bay's water on its inner side, beside it from root
        // to tip; nothing past the tip, which the waves still reach)
        const sIn = (Ax*mu - Au*mx) > 0 ? 1 : -1, np = pl.length >> 1;
        const leeOf = i => {
          const r = (i/C)|0, c = i - r*C, x0 = xOf(c), u0 = uOf(r);
          let bd = 1e18, side = 0, end = true;
          for (let k = 0; k + 1 < np; k++){
            const ax2 = pl[2*k], au2 = pl[2*k + 1], vx = pl[2*k + 2] - ax2, vu = pl[2*k + 3] - au2, L2 = vx*vx + vu*vu || 1e-9;
            let t = ((x0 - ax2)*vx + (u0 - au2)*vu)/L2;

            t = t < 0 ? 0 : t > 1 ? 1 : t;
            const px2 = x0 - ax2 - t*vx, pu2 = u0 - au2 - t*vu, d2 = px2*px2 + pu2*pu2;

          }
          return side > 0 && !end;
        };
        const lee = [];
        if (s >= 5*cell){
          for (const i of cellsK) if (E[i] <= 0 && !LAG[i] && leeOf(i)) lee.push(i);
        }
        // (seen on the map, a spit is a strip with water behind it; one that
        // would close off only a sliver narrower than the map shows lies
        // against the shore and is part of it: no spit drawn, and the bay is
        // left to its sand as any other)
        if (lee.length*cell >= 1.8*s){
          const hw = sL.map(v => 0.55 + 0.35*Math.pow(Math.max(0, v)/Math.max(s, 1e-6), 2));
          SPL.push({ p: pl, h: hw });
          let cp = -1, rp = -1;
          const lay = (c, r) => {
            if (c < 0 || c >= C || r < 0 || r >= R) return;
            const i = r*C + c;
            if (E[i] > 0) return;
            E[i] = 2; BAR[i] = 1; sandM[i] = 1;
          };
          for (let k = 0; k < pl.length; k += 2){
            const c = colOf(pl[k]), r = rowOf(pl[k + 1]);
            if (c === cp && r === rp) continue;
            if (cp >= 0 && c !== cp && r !== rp) lay(c, rp);
            lay(c, r);
            cp = c; rp = r;
          }
          // (its root kept: the headland's point it stands on is not worn
          // away from under it later)
          { const c = colOf(pl[0]), r = rowOf(pl[1]), i = r*C + c; if (E[i] > 0 && !LAG[i]) LAG[i] = 3; }
          for (const i of lee) LAG[i] = 1;
          if (closed) SPC++;
          SPN++;
          continue;
        }
      }
      // A bay with no spit: its beach built out towards the waves' shape as
      // far as the sand to hand will go. What reaches it since the sea came
      // to stand here is the drift the waves keep moving along this shore
      // (m3 a year, with the wave height to the power 2.5, where there is
      // sand) over those millennia; each cell of bay filled takes its area
      // times its depth and the beach's height. A small bay is filled to the
      // shape and holds it; a long inlet is filled only at its head, and
      // keeps its drowned shape out towards the sea. (Volumes go with the
      // map's scale, as its shapes do.)
      const Q0 = 1e5*Math.pow(Hw, 2.5)*sig, cA = cell*cell*1e6;
      const Vcap = Q0*(3 + 4*age)*1000*kr*kr;
      // (each cell's place against that shape: how far in the shore would
      // have to lie for it to be still water; filled from the head of the
      // bay outwards, while the sand lasts)
      const idx = [], keys = [], vols = [];
      for (const i of cellsK){
        if (LAG[i] || E[i] > 0) continue;
        const r = (i/C)|0, c = i - r*C, dx = xOf(c) - Ux, du = uOf(r) - Uu, xc = dx*cX + du*cU, yw = dx*wX + du*wU;
        const key = xc >= 0 ? yw : Math.sqrt(xc*xc + yw*yw)/Math.exp(-Math.atan2(-xc, yw)*COTA);
        if (key <= ys) continue;
        idx.push(i); keys.push(key); vols.push(cA*(Math.max(1, -E[i]) + 4));
      }
      const ord = idx.map((_, k) => k).sort((p, q2) => keys[q2] - keys[p]);
      let Vused = 0;
      for (const k of ord){
        Vused += vols[k];
        if (Vused > Vcap) break;
        const i = idx[k];
        E[i] = Math.min(14, 2 + 0.05*(keys[k] - ys)*cell); sandM[i] = 1;
      }
    }
  }

  // Islands near the shore. Behind an island the waves are cut off; they
  // come round both its ends and bend into its shadow, and the drift from
  // either side meets there and drops its sand. The mainland's beach builds
  // out towards the island, a salient, a blunt cusp of sand; if the island
  // is long for its distance from the shore (longer than it is far off),
  // the salient reaches it and ties it to the land, a tombolo, a bar of
  // sand from shore to island (across a strait of some km at most). A small
  // island far out leaves the shore behind it as it was.
  if (!glac){
    lab.fill(-1);
    const comps = [];
    let sp = 0;
    for (let i0 = 0; i0 < n; i0++){
      if (lab[i0] !== -1 || E[i0] <= 0) continue;
      const id = comps.length, cells = [];
      let top = false;
      stk[sp++] = i0; lab[i0] = id;
      while (sp){
        const i = stk[--sp], r = (i/C)|0, c = i - r*C;
        cells.push(i); if (r === 0) top = true;
        for (let k = 0; k < 8; k++){
          const rr = r + DR8[k], cc = c + DC8[k];
          if (rr < 0 || rr >= R || cc < 0 || cc >= C) continue;
          const j = rr*C + cc;
          if (lab[j] === -1 && E[j] > 0){ lab[j] = id; stk[sp++] = j; }
        }
      }
      comps.push({ cells, top });
    }
    const bigIsl = Math.pow(150*kr/cell, 2);
    for (const K of comps){
      const nc = K.cells.length;
      if (K.top || nc < 2 || nc > bigIsl) continue;
      let sx = 0, su = 0;
      for (const i of K.cells){ const r = (i/C)|0, c = i - r*C; sx += xOf(c); su += uOf(r); }
      const cx = sx/nc, cu = su/nc, ext = Math.sqrt(nc)*cell;
      // (the waves that reach it, from the open water on its seaward side)
      let wb = null;
      for (let k = 0; k < 8; k++){
        const an = k*Math.PI/4, x = cx + Math.cos(an)*(0.7*ext + 2*cell), u = cu + Math.sin(an)*(0.7*ext + 2*cell);
        const i = rowOf(u)*C + colOf(x);
        if (E[i] > 0) continue;
        const w = wave(x, u);
        if (!wb || w.e > wb.e) wb = w;
      }
      if (!wb || wb.e < 0.3) continue;
      const wX = -wb.fx, wU = -wb.fu, cX = -wU, cU = wX;
      // (its length across the waves, and its lee edge along them)
      let lo = 1e9, hi = -1e9, lee = -1e9;
      for (const i of K.cells){
        const r = (i/C)|0, c = i - r*C, dx = xOf(c) - cx, du = uOf(r) - cu;
        const a1 = dx*cX + du*cU, a2 = dx*wX + du*wU;
        if (a1 < lo) lo = a1; if (a1 > hi) hi = a1; if (a2 > lee) lee = a2;
      }
      const Ls = hi - lo + cell;
      // (on from its lee along the waves' way, to the shore behind it)
      let X = -1, hx = 0, hu = 0, hi2 = -1, dsum = 0, dn = 0;
      for (let f = lee + 0.5*cell; f < lee + Math.max(3*Ls, 20*cell); f += 0.5*cell){
        const x = cx + wX*f, u = cu + wU*f, c = colOf(x), r = rowOf(u), i = r*C + c;
        if (c <= 0 || c >= C - 1 || r <= 0 || r >= R - 1) break;
        if (E[i] > 0){ if (comps[lab[i]] && comps[lab[i]].top){ X = f - lee; hx = x; hu = u; hi2 = i; } break; }
        dsum += -E[i]; dn++;
      }
      if (X < 1.5*cell || SN[hi2] < 0.3) continue;
      const ratio = Ls/X;
      if (ratio < 0.5) continue;
      // (a bar that long takes sand: its length, its width and the depth it
      // stands in; the drift from both sides in the millennia the sea has
      // stood here must be enough, or it stops short, a salient)
      const Hi = Hs0*wb.e/0.86, need = X*1000*1500*kr*(dsum/Math.max(1, dn) + 4);
      const have = 2*1e5*Math.pow(Hi, 2.5)*SN[hi2]*(3 + 4*age)*1000*kr*kr;
      // (and it is found only across a narrow strait, some km, not tens:
      // wider, the tide running through keeps it open)
      if (ratio > 1.2 && need <= have && X <= 12*kr){
        // tombolo: from the island's lee to the shore, flaring where it
        // meets each
        const x0 = cx + wX*(lee - 0.5*cell), u0 = cu + wU*(lee - 0.5*cell);
        const Lt = X + cell, pl = [], hw = [];
        for (let f = 0; f <= Lt + 1e-6; f += 0.3*cell){
          const x = x0 + wX*f, u = u0 + wU*f, t = f/Lt;
          pl.push(x, u); hw.push(0.6 + 1.5*Math.pow(t, 2.5) + 0.4*(1 - t)*(1 - t));
          const i = rowOf(u)*C + colOf(x);
          if (E[i] <= 0){ E[i] = 2; BAR[i] = 1; sandM[i] = 1; }
        }
        SPL.push({ p: pl, h: hw });
        TMB++;
      } else {
        // salient: the shore built out in a cusp towards the island, the
        // further the longer the island is for its distance
        let Sl = X*(0.25 + 0.45*(Math.min(1.2, ratio) - 0.5)/0.7), Bw = Math.min(0.6*Ls, 1.5*X) + Sl;
        // (no more of it than the sand will build)
        const vol = 0.77*Sl*Bw*1e6*(dsum/Math.max(1, dn) + 4);
        if (vol > have){ const k = Math.sqrt(have/vol); Sl *= k; Bw *= k; }
        if (Sl < 0.7*cell) continue;
        const c0 = colOf(Math.min(hx - Bw, hx - wX*Sl) - cell), c1 = colOf(Math.max(hx + Bw, hx - wX*Sl) + cell);
        const r0 = rowOf(Math.min(hu - Bw, hu - wU*Sl) - cell), r1 = rowOf(Math.max(hu + Bw, hu - wU*Sl) + cell);
        for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++){
          const i = r*C + c;
          if (E[i] > 0 || LAG[i]) continue;
          const dx = xOf(c) - hx, du = uOf(r) - hu, along = -(dx*wX + du*wU), lat = Math.abs(dx*cX + du*cU);
          if (lat >= Bw || along >= Sl) continue;
          if (along < Sl*Math.pow(1 - lat/Bw, 1.6)){ E[i] = 2 + 0.05*(Sl - along); sandM[i] = 1; }
        }

      }
    }
  }

  // (the spits' own shape, from their lines: a strip a little over a cell
  // across, its tip rounded)
  for (const S of SPL){
    const P = S.p, HWP = S.h;
    for (let k = 0; k + 3 < P.length; k += 2){
      const x0 = P[k], u0 = P[k + 1], x1 = P[k + 2], u1 = P[k + 3], dx = x1 - x0, du = u1 - u0, L2 = dx*dx + du*du || 1e-9;
      const h0 = HWP[k >> 1], h1 = HWP[(k >> 1) + 1];
      const ca = Math.max(0, colOf(Math.min(x0, x1)) - 2), cb = Math.min(C - 1, colOf(Math.max(x0, x1)) + 2);
      const ra = Math.max(0, rowOf(Math.min(u0, u1)) - 2), rb = Math.min(R - 1, rowOf(Math.max(u0, u1)) + 2);
      for (let r = ra; r <= rb; r++) for (let c = ca; c <= cb; c++){
        const x = xOf(c), u = uOf(r);
        let t = ((x - x0)*dx + (u - u0)*du)/L2;
        t = t < 0 ? 0 : t > 1 ? 1 : t;
        const v = h0 + (h1 - h0)*t - hyp(x - x0 - t*dx, u - u0 - t*du)/cell, i = r*C + c;
        if (v > STR[i]) STR[i] = v;
      }
    }
  }

  // Lagoons. Along a low, sandy coast open to the waves, with the tide
  // small, the sea built its beach a little out from the old shore as it
  // rose, and drowned the low ground behind: a barrier with a lagoon behind
  // it, opened to the sea here and there by an inlet. The barrier lies along
  // the shore as the waves would draw it, smoothed of its small bays and
  // points (it runs across the one and cuts the other off), and the lagoon
  // behind it is the old land gone under: some km across, further in along
  // the low ground and less where it rises, so its inner shore is as ragged
  // as the old coast was. Only on some stretches: where the sand runs short,
  // or the ground is hard or high, or the shore stands out into the waves or
  // curls round a bay's head, there is none, and the lagoon closes up
  // towards either end of its stretch.
  if (!jag && tide < 3.5){
    const share = sstep(0.45, 0.9, sand0)*sstep(3.5, 1.2, tide);
    if (share > 0.02){
      for (let i = 0; i < n; i++) T[i] = E[i] > 0 ? 0.5 : -0.5;
      sdf(T, C, R, D1, px, py);
      // the shore as the waves would draw it (the land's signed distance,
      // smoothed over some 20 km); the barrier's line lies just inside it
      const Rs = Math.max(2, Math.round(18*kr/cell)), off = 0.3;
      const PS = F32(n);
      for (let i = 0; i < n; i++) PS[i] = Math.max(-3*Rs, Math.min(3*Rs, D1[i]));
      blur3(PS, D2, C, R, Rs);
      // (and over some 110 km, to tell a bulge of the coast from a bight)
      const PSL = F32(n);
      for (let i = 0; i < n; i++) PSL[i] = Math.max(-40, Math.min(40, D1[i]));
      blur3(PSL, D2, C, R, Math.max(4, Math.round(110*kr/cell)));
      const OPL = F32(n), OPW = F32(n);
      for (let i = 0; i < n; i++) OPL[i] = OPW[i] = E[i] > 0 ? 0 : 1;
      blur3(OPL, D2, C, R, Math.max(2, Math.round(25/cell)));
      // (and over some 70 km: a coast with broad land behind it, not the
      // head of a small peninsula or an island standing in the sea)
      blur3(OPW, D2, C, R, Math.max(3, Math.round(70*kr/cell)));
      // (how far apart the inlets lie, km: with the tide small, the lagoon's
      // water has little to push through and a long barrier runs on with
      // few breaks; with more tide, many inlets cut it into short islands)
      // (inlets never so far apart that a whole barrier runs unbroken: a
      // chain of lens lagoons behind unbroken bars read as stamped)
      const Sin = 15 + 45*sstep(2.8, 0.7, tide), nThr = 0.12 - 1.3*sstep(1.2, 2.8, tide);
      const LG = F32(n), LW = F32(n), NI = F32(n), NJ = F32(n), NR = F32(n);
      coarse(CS, 5, (x, u, v) => {
        v[0] = fbm(x, u, seed ^ 0x1a60, 2, Math.max(12*cell, 300*ks), 0.5);
        v[1] = fbm(x, u, seed ^ 0x1a61, 2, Math.max(6*cell, 120*ks), 0.5);
        v[2] = fbm(x, u, seed ^ 0x1a62, 1, Math.max(8*cell, 2*Sin*kr), 0.5);
        v[3] = fbm(x, u, seed ^ 0x1a63, 1, Math.max(8*cell, 160*ks), 0.5);
        v[4] = fbm(x, u, seed ^ 0x1a64, 3, Math.max(3*cell, 30*ks), 0.55);
      }, [LG, LW, NI, NJ, NR]);
      // which stretches: judged along the barrier's line, then carried a
      // little inland (and along) so the lagoon's width follows it smoothly
      // (judged from the water just off the line, every other cell: the
      // waves must reach it from the open sea, for they build the barrier)
      const thr = 0.3 - 0.5*share, GW = F32(n), GN = F32(n);
      for (let r = 0; r < R; r += 2) for (let c = 0; c < C; c += 2){
        const i = r*C + c;
        if (Math.abs(PS[i] - off) > 1.5 || E[i] > 0) continue;
        GN[i] = 1;
        // (not in the inland sea's basin, nor in the water a spit has
        // closed off: no swell reaches in there)
        if ((FB && FB[i]) || (GF && GF[i]) || LAG[i]) continue;
        const op = OPL[i];
        // (along straight and gently curved stretches and in the bights, not
        // over the crest of a bulge of the coast)
        let g = sstep(thr, thr + 0.15, LG[i])*sstep(0.55, 0.35, HD[i])*sstep(0.3, 0.45, SN[i])*sstep(0.22, 0.3, op)*sstep(0.74, 0.64, op)*sstep(0.62, 0.52, OPW[i])*sstep(3, -1.5, PSL[i] - PS[i]);
        if (g > 0) g *= sstep(0.35, 0.55, wave(xOf(c), uOf(r)).e);
        if (PM5 && PM5[i]) g = 0;
        GW[i] = g;
      }
      const Rg = Math.max(2, Math.round(30*kr/cell));
      blur3(GW, D2, C, R, Rg); blur3(GN, D2, C, R, Rg);
      // (how far a cell lies inside the barrier's line, in cells; and how
      // far the lagoon reaches in there)
      // (and the ground's height round about, over the land alone: what is
      // lower than that is a hollow, and the water runs further in along it)
      const DS = F32(n), WC = F32(n), Eb = F32(n), E1 = F32(n), Lb = F32(n), FF = F32(n).fill(-9);
      for (let i = 0; i < n; i++){ Eb[i] = E1[i] = E[i] > 0 ? E[i] : 0; Lb[i] = E[i] > 0 ? 1 : 0; }
      blur3(Eb, D2, C, R, Math.max(2, Math.round(20*kr/cell))); blur3(Lb, D2, C, R, Math.max(2, Math.round(20*kr/cell)));
      for (let i = 0; i < n; i++) Eb[i] = Lb[i] > 0.02 ? Eb[i]/Lb[i] : 0;
      for (let i = 0; i < n; i++) Lb[i] = E[i] > 0 ? 1 : 0;
      blur3(E1, D2, C, R, 1); blur3(Lb, D2, C, R, 1);
      for (let i = 0; i < n; i++) E1[i] = Lb[i] > 0.02 ? E1[i]/Lb[i] : 0;
      for (let r = 1; r < R - 1; r++) for (let c = 1; c < C - 1; c++){
        const i = r*C + c;
        const gx = 0.5*(PS[i + 1] - PS[i - 1]), gu = 0.5*(PS[i + C] - PS[i - C]);
        DS[i] = (PS[i] - off)/Math.max(0.35, Math.sqrt(gx*gx + gu*gu));
        const g = GN[i] > 1e-5 ? GW[i]/GN[i] : 0;
        if (g < 0.05) continue;
        const s = Math.max(0, Math.min(1, 0.5 + 0.8*LW[i]));
        // (a lagoon a few km to some 25 across, never wider: drawn to the
        // view's size, a wide view had lagoons hundreds of km across)
        WC[i] = g*Math.min(26, (5 + 50*s*s*s)*kr)/cell;
      }
      // the ground behind the line that goes under: low ground further in
      const FL = U8(n);
      for (let i = 0; i < n; i++){
        const w = WC[i], ds = DS[i];
        if (w < 1 || ds < -3 || ds > w + 4) continue;
        if (ds <= -0.72){ if (E[i] > 0 && HD[i] < 0.5 && !(FB && FB[i])) FL[i] = 3; continue; }
        if (ds < 0.72){ FL[i] = 2; continue; }
        if (E[i] <= 0){ FL[i] = 1; continue; }
        if ((FB && FB[i]) || E[i] > 45) continue;
        // (how far past the lagoon's inner shore, in cells: + drowned)
        const z = Math.max(-0.5, Math.min(0.5, (Eb[i] - 0.5*(E[i] + E1[i]))/Math.max(3, Eb[i])));
        FF[i] = Math.max(1.2, w*Math.max(0.2, 1 + 1.6*z + 0.7*NR[i])) - ds;
        if (FF[i] > 0) FL[i] = 1;
      }
      // (only what is joined to the barrier's back is lagoon: no ponds)
      {
        let sp = 0;
        for (let r = 1; r < R - 1; r++) for (let c = 1; c < C - 1; c++){
          const i = r*C + c;
          if (FL[i] !== 1 || DS[i] > 1.8) continue;
          if (FL[i - 1] === 2 || FL[i + 1] === 2 || FL[i - C] === 2 || FL[i + C] === 2){ LAG[i] = 1; stk[sp++] = i; }
        }
        while (sp){
          const i = stk[--sp], r = (i/C)|0, c = i - r*C;
          if (c > 0 && FL[i - 1] === 1 && !LAG[i - 1]){ LAG[i - 1] = 1; stk[sp++] = i - 1; }
          if (c < C - 1 && FL[i + 1] === 1 && !LAG[i + 1]){ LAG[i + 1] = 1; stk[sp++] = i + 1; }
          if (r > 0 && FL[i - C] === 1 && !LAG[i - C]){ LAG[i - C] = 1; stk[sp++] = i - C; }
          if (r < R - 1 && FL[i + C] === 1 && !LAG[i + C]){ LAG[i + C] = 1; stk[sp++] = i + C; }
        }
      }
      // (a lagoon whose tide is too small to keep a gap open against the
      // sand driven along the barrier: its prism, area times range, under
      // some fifty years' drift, and the sand closes every inlet; it is a
      // lake behind an unbroken barrier)
      const CLD = U8(n);
      {
        lab.fill(-1);
        const Qb = 1e5*Math.pow(0.8*Hs0, 2.5)*sand0, cA2 = cell*cell*1e6;
        let sp = 0;
        for (let i0 = 0; i0 < n; i0++){
          if (lab[i0] !== -1 || (LAG[i0] !== 1 && LAG[i0] !== 2) || FL[i0] !== 1) continue;
          const cells = [];
          stk[sp++] = i0; lab[i0] = 1;
          while (sp){
            const i = stk[--sp], r = (i/C)|0, c = i - r*C;
            cells.push(i);
            for (const j of [c > 0 ? i - 1 : -1, c < C - 1 ? i + 1 : -1, r > 0 ? i - C : -1, r < R - 1 ? i + C : -1]){
              if (j >= 0 && lab[j] === -1 && (LAG[j] === 1 || LAG[j] === 2)){ lab[j] = 1; stk[sp++] = j; }
            }
          }
          if (cells.length*cA2*tide < 6*Qb) for (const i of cells) CLD[i] = 1;
        }
        // (and the barrier in front of it, a couple of cells round)
        for (let pass = 0; pass < 3; pass++){
          const T2 = Uint8Array.from(CLD);
          for (let r = 1; r < R - 1; r++) for (let c = 1; c < C - 1; c++){
            const i = r*C + c;
            if (!CLD[i] && (T2[i - 1] || T2[i + 1] || T2[i - C] || T2[i + C])) CLD[i] = 1;
          }
        }
      }
      // (the barrier is where there is lagoon behind it: within a couple of cells)
      const ACT = U8(n);
      for (let r = 2; r < R - 2; r++) for (let c = 2; c < C - 2; c++){
        const i = r*C + c;
        if (FL[i] !== 2 && FL[i] !== 3) continue;
        let lg = false;
        for (let dr = -2; dr <= 2 && !lg; dr++) for (let dc = -2; dc <= 2 && !lg; dc++){ const v = LAG[i + dr*C + dc]; if (v === 1 || v === 2) lg = true; }
        if (!lg && FL[i] === 3) for (let dr = -4; dr <= 4 && !lg; dr++) for (let dc = -4; dc <= 4 && !lg; dc++){ const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < R && cc >= 0 && cc < C && FL[rr*C + cc] === 2 && LAG[rr*C + cc]) lg = true; }
        if (lg) ACT[i] = 1;
      }
      const lw = j => LAG[j] === 1 || LAG[j] === 2;
      // the inlets: where the barrier is broken through, a cell or so
      // across, at a few places along it (the zero lines of a field of
      // tens of km, where they cross the barrier more or less square)
      for (let r = 1; r < R - 1; r++) for (let c = 1; c < C - 1; c++){
        const i = r*C + c;
        // (the drowned ground's depth, and the height of the ground at its
        // edge, both from how far past the inner shore they lie, so the
        // shore falls between the cells where that line runs, not along
        // their sides; the water right behind the barrier kept open)
        if ((LAG[i] === 1 || LAG[i] === 2) && E[i] > 0) E[i] = -Math.min(3, Math.max(0.3, FF[i]));
        else if (!LAG[i] && E[i] > 0 && FF[i] > -1.5 && (lw(i - 1) || lw(i + 1) || lw(i - C) || lw(i + C) || lw(i - C - 1) || lw(i - C + 1) || lw(i + C - 1) || lw(i + C + 1))){ E[i] = Math.min(E[i], Math.max(0.3, -FF[i])); LAG[i] = 3; }
        if (LAG[i] === 1 && FL[i] === 1 && DS[i] < 1.8) LAG[i] = 2;
        if (FL[i] === 3 && ACT[i]) E[i] = -1.5;
        if (FL[i] !== 2 && !(Math.abs(DS[i]) < 2 && WC[i] >= 1)) continue;
        // (is there an inlet here, and how far from it)
        const nx = 0.5*(NI[i + 1] - NI[i - 1]), nu = 0.5*(NI[i + C] - NI[i - C]), gn = Math.sqrt(nx*nx + nu*nu) || 1e-6;
        const px2 = 0.5*(PS[i + 1] - PS[i - 1]), pu2 = 0.5*(PS[i + C] - PS[i - C]), gp = Math.sqrt(px2*px2 + pu2*pu2) || 1e-6;
        const sq = Math.abs(nx*pu2 - nu*px2)/(gn*gp);
        const inl = NJ[i] > nThr && sq > 0.35 && !CLD[i] ? Math.abs(NI[i])/gn : 9;
        let near = FL[i] === 2 ? ACT[i] : 0;
        if (!near) for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1 && !near; dc++){ const j = i + dr*C + dc; if (FL[j] === 2 && ACT[j]) near = 1; }
        if (!near) continue;
        const v = Math.min(HWS - Math.abs(DS[i]), inl - 0.5);
        if (v > STR[i]) STR[i] = v;
        if (FL[i] === 2 && ACT[i]){
          if (inl < 0.72){ E[i] = -1.5; LAG[i] = 1; }
          else { E[i] = 2; BAR[i] = 2; sandM[i] = 1; }
        }
      }
    }
  }
  return { sand: sandM, bar: BAR, lag: LAG, str: STR, spits: SPN, closedSpits: SPC, tombolos: TMB, salients: SAL, cells: cellStats, funnel: PFUN };
}

<script>
'use strict';
(function(){
  const canvas = document.getElementById('c');

  const kmInput = document.getElementById('km');

  const CELL_PX = 2;               // screen grid spacing, in CSS pixels
  // the end handles sit this far in from the edges: whole on screen, and
  // out of the strip a phone keeps for its edge swipes
  const HX = 12;
  // the field's columns across the view: about one to every 2.2 pixels,
  // 200 to 760 (a phone gets a coarser field and a far taller one)
  let FIELD_COLS = 760;
  let seed = (Math.random()*1e9)|0;
  let Wkm = 1000;
  let mode = 'plain';
  let chr = 'div';                   // coast character: divergent, jagged, graded or mixed
  let ctrl = 'tilt';                 // tilt: a straight baseline · points: generated through anchors
  let offL = 0, offR = 0;            // tilt handle offsets in km
  let bakeL = 0, bakeR = 0;          // the tilt the current coast was generated along
  let pL = 0, pR = 0, pMx = 500, pMu = 0;   // points anchors in km
  let dragging = null, hover = null;

  // ---- a link to a coast: the hash names what the controls would set
  // (#seed=54&km=3000&chr=jag&mode=sea&ctrl=tilt&l=-200&r=300, or with
  // ctrl=points &l=..&r=..&mx=..&mu=.., the handles in km), so that a
  // coast can be opened again as it was ----
  {

    const num = (k, d) => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : d; };
    const pick = (k, opts, d) => opts.includes(q.get(k)) ? q.get(k) : d;
    seed = num('seed', seed)|0;
    Wkm = Math.min(20000, Math.max(200, num('km', Wkm)));
    chr = pick('chr', ['div', 'jag', 'grd', 'mix'], chr);
    mode = pick('mode', ['plain', 'pen', 'sea'], mode);
    ctrl = pick('ctrl', ['tilt', 'points'], ctrl);
    if (ctrl === 'points'){ pL = num('l', 0); pR = num('r', 0); pMx = num('mx', Wkm/2); pMu = num('mu', 0); }
    else { offL = num('l', 0); offR = num('r', 0); }
    kmInput.value = Wkm;
    for (const [id, v] of [['char', chr], ['mode', mode], ['ctrl', ctrl]])
      for (const b of document.querySelectorAll('#' + id + ' button')) b.setAttribute('aria-pressed', b.dataset[id] === v);
  }
  // (for a script driving the page: the field as generated, and how many
  // coasts have been generated so far)
  let gens = 0;

  // ---- working a coast out ----
  // In a worker, from this page's own generation script, so the page stays

  // Land joins across corners, water only side to side. When neither did,

        const s00 = SHD[iA], s01 = SHD[iA+1], s10 = SHD[iB], s11 = SHD[iB+1];
        // how far the field shifts per screen pixel, which turns the sea
        // level crossing into one pixel of blend however the coast runs:
        // no stair steps, and no halo either
        const gx = (p01 - p00 + p11 - p10)*0.5/SUB;
        const gy = (p10 - p00 + p11 - p01)*0.5/SUB;
        const ig = 1/(Math.sqrt(gx*gx + gy*gy) + 1e-4);
        for (let sy = 0; sy < SUB; sy++){
          const ty = TS[sy];
          const pa = p00 + (p10 - p00)*ty, pb = p01 + (p11 - p01)*ty;
          const qa = q00 + (q10 - q00)*ty, qb = q01 + (q11 - q01)*ty;
          const ea = e00 + (e10 - e00)*ty, eb = e01 + (e11 - e01)*ty;
          const sa = s00 + (s10 - s00)*ty, sb = s01 + (s11 - s01)*ty;
          let o = (r*SUB + sy)*RW + c*SUB;         // pixel index
          for (let sx = 0; sx < SUB; sx++, o++){
            const tx = TS[sx];
            // (each tone worked out only where it is painted)
            const p = pa + (pb - pa)*tx;
            const cov = 0.5 + p*ig;
            if (cov >= 1){
              const e = ea + (eb - ea)*tx, k = ((sa + (sb - sa)*tx + 1)*31.5 + 0.5)|0;
              d32[o] = LANDS_P[ramp(e)*64 + (k < 0 ? 0 : k > 63 ? 63 : k)];
            }
            else if (cov <= 0) d32[o] = WATER_P[ramp(wTone(qa + (qb - qa)*tx))];
            else {
              const q = qa + (qb - qa)*tx, e = ea + (eb - ea)*tx;
              const a = ramp(e)*3, b = ramp(wTone(q))*3, k = o*4;
              d[k]   = WATER_R[b]   + (LAND_R[a]   - WATER_R[b])*cov;
              d[k+1] = WATER_R[b+1] + (LAND_R[a+1] - WATER_R[b+1])*cov;
              d[k+2] = WATER_R[b+2] + (LAND_R[a+2] - WATER_R[b+2])*cov;
            }
          }
        }
      }
    }
    t.octx.putImageData(t.img, 0, 0);
    shown = t;
  }

  function draw(){
    if (!shown) return;
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(shown.off, 0, 0, W, H);

    if (ctrl === 'points'){
      if (dragging){
        // preview of the new baseline while dragging; coast follows on release
        ctx.beginPath();
        ctx.setLineDash([6, 6]);
        for (let i = 0; i <= 120; i++){
          const x = i/120*Wkm;
          const y = (0.5 + tabAt(Bt, x)/Hkm)*H;
          if (i === 0) ctx.moveTo(x/Wkm*W, y); else ctx.lineTo(x/Wkm*W, y);
        }
        ctx.strokeStyle = C_INK;
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.setLineDash([]);
      }
      drawHandle(HX, (0.5 + pL/Hkm)*H, hover === 'L' || dragging === 'L');
      drawHandle(W - HX, (0.5 + pR/Hkm)*H, hover === 'R' || dragging === 'R');
      drawHandle(pMx/Wkm*W, (0.5 + pMu/Hkm)*H, hover === 'M' || dragging === 'M');
    } else {
      drawHandle(HX, (0.5 + offL/Hkm)*H, hover === 'L' || dragging === 'L');
      drawHandle(W - HX, (0.5 + offR/Hkm)*H, hover === 'R' || dragging === 'R');
    }
  }

  function drawHandle(x, y, hot){
    ctx.beginPath();
    ctx.arc(x, y, hot ? 10 : 8, 0, Math.PI*2);
    ctx.fillStyle = C_PARCH;
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = C_INK;
    ctx.stroke();
  }

  function render(clean){ if (!F) return; remap(clean); paint(clean ? hi : lo); draw(); }

  // ---- interaction ----
  function pick(x, y){
    const uL = ctrl === 'points' ? pL : offL;
    const uR = ctrl === 'points' ? pR : offR;
    if (ctrl === 'points' &&
        hyp(x - pMx/Wkm*W, y - (0.5 + pMu/Hkm)*H) < 26) return 'M';
    if (hyp(x - HX, y - (0.5 + uL/Hkm)*H) < 26) return 'L';
    if (hyp(x - (W - HX), y - (0.5 + uR/Hkm)*H) < 26) return 'R';
    return null;
  }
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  let raf = 0;
  function scheduleDraw(clean){
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; render(clean); });
  }

  let dragId = 0;
  canvas.addEventListener('pointerdown', e => {
    // one drag at a time, and only from a primary press: a second finger
    // must not take over a drag, nor a right-click start one
    if (dragging || e.button !== 0) return;
    const p = pos(e);
    dragging = pick(p.x, p.y);
    if (dragging){ dragId = e.pointerId; canvas.setPointerCapture(e.pointerId); }
  });
  canvas.addEventListener('pointermove', e => {
    if (dragging && e.pointerId !== dragId) return;
    const p = pos(e);
    if (dragging){
      const f = Math.min(0.9, Math.max(0.1, p.y / H));
      const u = (f - 0.5)*Hkm;
      if (ctrl === 'points'){
        if (dragging === 'M'){
          pMx = Math.min(0.9, Math.max(0.1, p.x / W))*Wkm;
          pMu = u;
        } else if (dragging === 'L') pL = u;
        else pR = u;
        buildCurve();
        draw();               // preview only; the coast regenerates on release
      } else {
        if (dragging === 'L') offL = u; else offR = u;
        scheduleDraw(false);
      }
    } else {
      const h = pick(p.x, p.y);
      if (h !== hover){ hover = h; draw(); }
      canvas.style.cursor = h === 'M' ? 'move' : (h ? 'ns-resize' : 'default');
    }
  });
  function endDrag(){
    dragging = null;
    // a drag frame still queued would paint over the clean frame below
    if (raf){ cancelAnimationFrame(raf); raf = 0; }
    if (ctrl === 'points') draw(); else render(true);
    regenSoon();
  }
  function release(e){ if (dragging && e.pointerId === dragId) endDrag(); }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('lostpointercapture', release);
  // a context menu (ctrl-click on a Mac) swallows the pointerup
  canvas.addEventListener('contextmenu', () => { if (dragging) endDrag(); });

  // The hint names what the handles do in the current mode, and leaves
  // out the Space key where there is no keyboard to press it on.
  const hintEl = document.getElementById('hint');
  const touchOnly = matchMedia('(hover: none)');
  function hint(){
    const what = ctrl === 'points' ? 'Drag the handles to bend the coast' : 'Drag the handles up or down';
    hintEl.textContent = touchOnly.matches ? what : what + ' \u00a0\u00b7\u00a0 Space for a new coast';
  }
  touchOnly.addEventListener('change', hint);
  hint();

  // a segmented control: exactly one button of the group is on
  function segmented(id, get, set){
    document.getElementById(id).addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b || b.dataset[id] === get()) return;
      b.blur();
      for (const o of document.querySelectorAll('#' + id + ' button')) o.setAttribute('aria-pressed', o === b);
      set(b.dataset[id]);
    });
  }
  segmented('char', () => chr, v => { chr = v; regenSoon(); });
  segmented('mode', () => mode, v => { mode = v; regenSoon(); });
  segmented('ctrl', () => ctrl, v => {
    ctrl = v;
    if (ctrl === 'points'){
      pL = offL; pR = offR;
      pMx = Wkm/2; pMu = (pL + pR)/2;
      buildCurve();
    } else {
      offL = pL; offR = pR;
    }
    hint();
    regenSoon();
  });
  document.getElementById('dots').addEventListener('click', function(){
    this.blur();
    // same span a drag can reach, uniform across it
    const u = () => (Math.random()*0.8 - 0.4)*Hkm;
    if (ctrl === 'points'){
      pL = u(); pR = u(); pMu = u();
      pMx = (0.1 + 0.8*Math.random())*Wkm;
      regenSoon();
    } else {
      offL = u(); offR = u();
      regenSoon();
    }
  });

  document.getElementById('reroll').addEventListener('click', function(){
    this.blur();
    reroll();
  });
  window.addEventListener('keydown', e => {
    // Space on a focused button or in the width box belongs to that control.
    // Auto-repeat is ignored: each repeat would queue a full regeneration.
    if (e.code !== 'Space' || e.repeat) return;
    if (e.target instanceof Element && e.target.closest('button, input')) return;
    e.preventDefault();
    reroll();
  });
  // Handles are held in km. A new width scales them with the map, so they
  // stay where they were on screen; a new window shape only pulls them back
  // into the span a drag can reach, so a Points coast survives it.
  function scaleHandles(k){
    offL *= k; offR *= k; pL *= k; pR *= k; pMu *= k; pMx *= k;
  }
  function clampHandles(){
    const lim = 0.4*Hkm, c = v => Math.max(-lim, Math.min(lim, v));
    offL = c(offL); offR = c(offR); pL = c(pL); pR = c(pR); pMu = c(pMu);
  }

  kmInput.addEventListener('change', () => {
    const v = parseFloat(kmInput.value);
    if (!isFinite(v)) { kmInput.value = Wkm; return; }
    const w = Math.min(20000, Math.max(200, v));
    kmInput.value = w;
    scaleHandles(w/Wkm);
    Wkm = w;
    Hkm = Wkm * H / W;
    regenSoon();
  });

  // ---- sizing ----
  // an offscreen image with sub paint pixels per grid cell, per axis, and
  // where those pixels sit inside the cell
  function target(sub){
    const off = document.createElement('canvas');
    off.width = (gc - 1)*sub; off.height = (gr - 1)*sub;
    const octx = off.getContext('2d');
    const img = octx.createImageData(off.width, off.height);
    for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
    const ts = new Float64Array(sub);
    for (let s = 0; s < sub; s++) ts[s] = (s + 0.5)/sub;
    return { sub, ts, off, octx, img, px: new Uint32Array(img.data.buffer) };
  }
  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    // the CSS size is set from the same numbers the drawing and hit-testing
    // use: 100vh is taller than innerHeight while a mobile toolbar shows
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // +1: the grid's end points sit on the canvas edges, so a paint target
    // spans the canvas and, at whole-number pixel ratios, lands on it one
    // to one instead of being resampled
    gc = Math.max(80, Math.round(W / CELL_PX) + 1);
    gr = Math.max(45, Math.round(H / CELL_PX) + 1);
    Hkm = Wkm * H / W;
    FIELD_COLS = Math.max(200, Math.min(760, Math.round(W/2.2)));
    clampHandles();
    phi = new Float32Array(gc*gr);
    tnt = new Float32Array(gc*gr);
    ELG = new Float32Array(gc*gr);
    SHD = new Float32Array(gc*gr);
    lo = target(CELL_PX);
    const sub = Math.round(CELL_PX*dpr);
    hi = sub > CELL_PX ? target(sub) : lo;
    C_LAND = hex('--land'); C_LAND2 = [C_LAND[0]-40, C_LAND[1]-46, C_LAND[2]-48];
    C_WHI = hex('--water-hi'); C_WLO = hex('--water-lo'); C_WSH = hex('--water-shoal');
    C_INK = css('--ink'); C_PARCH = css('--parchment');
    buildRamps();
    regen();
    // (the canvas is cleared by its new size: until the coast for the new
    // window is in, the one there is drawn for it)
    if (shownSeq < seqN) render(false);
  }
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  resize();
})();
</script>
</body>
</html>
